<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DS Overflow — 3D Tactile Data Structures Playground</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700;800&display=swap');

    :root {
      --bg-cream: #faf8f2;
      --border-dark: #161a24;
      --shadow-dark: #161a24;
      --color-orange: #ff6b35;
      --color-blue: #2563eb;
      --color-yellow: #f59e0b;
      --color-green: #10b981;
      --color-purple: #9333ea;
      --color-pink: #f43f5e;
    }

    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Blueprint grid background */
    body {
      background-color: var(--bg-cream);
      background-image: 
        linear-gradient(to right, rgba(37, 99, 235, 0.07) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(37, 99, 235, 0.07) 1.5px, transparent 1.5px);
      background-size: 30px 30px;
      color: #161a24;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Neo-Brutalist Card Containers */
    .neo-card {
      background: #ffffff;
      border: 3px solid var(--border-dark);
      border-radius: 20px;
      box-shadow: 6px 6px 0px var(--shadow-dark);
      position: relative;
    }

    .neo-card-sm {
      background: #ffffff;
      border: 2.5px solid var(--border-dark);
      border-radius: 14px;
      box-shadow: 4px 4px 0px var(--shadow-dark);
    }

    /* 3D Keycaps Navigation */
    .keycap-nav {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.8rem 1rem;
      border-radius: 14px;
      border: 2.5px solid var(--border-dark);
      background: #ffffff;
      box-shadow: 0 4px 0px var(--border-dark);
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.15s ease;
      color: #161a24;
      user-select: none;
      width: 100%;
      text-align: left;
    }

    .keycap-nav:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0px var(--border-dark);
      background: #fffbf5;
    }

    .keycap-nav:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0px var(--border-dark);
    }

    .keycap-nav.active {
      background: #ffedd5;
      border-color: var(--border-dark);
      box-shadow: 0 2px 0px var(--border-dark);
      transform: translateY(2px);
    }

    /* 3D Extruded Keycap Buttons */
    .key-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      height: 42px;
      padding: 0 1.15rem;
      font-size: 0.875rem;
      font-weight: 800;
      border: 2.5px solid var(--border-dark);
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
      transition: all 0.12s ease;
      box-shadow: 0 4px 0px var(--border-dark);
      white-space: nowrap;
    }

    .key-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 0px var(--border-dark);
    }

    .key-btn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 1px 0px var(--border-dark);
    }

    .key-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      box-shadow: 0 2px 0px var(--border-dark);
    }

    .key-btn-orange { background: #ff6b35; color: #ffffff; }
    .key-btn-blue   { background: #2563eb; color: #ffffff; }
    .key-btn-green  { background: #10b981; color: #ffffff; }
    .key-btn-yellow { background: #f59e0b; color: #161a24; }
    .key-btn-purple { background: #9333ea; color: #ffffff; }
    .key-btn-pink   { background: #f43f5e; color: #ffffff; }
    .key-btn-white  { background: #ffffff; color: #161a24; }

    /* Neo Inputs */
    .neo-input {
      background: #ffffff;
      border: 2.5px solid var(--border-dark);
      border-radius: 12px;
      height: 42px;
      padding: 0 0.95rem;
      font-size: 0.9rem;
      font-weight: 700;
      color: #161a24;
      box-shadow: inset 1.5px 1.5px 0px rgba(0,0,0,0.06);
      outline: none;
      transition: all 0.15s;
    }
    .neo-input:focus {
      border-color: var(--color-blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    /* Complexity Badges */
    .sticker-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.35rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      border: 2.5px solid var(--border-dark);
      box-shadow: 2.5px 2.5px 0px var(--border-dark);
      white-space: nowrap;
    }

    /* ══════════════════════════════════════════════
       3D KEYCAP CELL (Perfected Alignment & Depth)
    ══════════════════════════════════════════════ */
    .keycap-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      padding-top: 34px; /* Reserved headroom for floating pointer without collision */
    }

    .keycap-3d {
      position: relative;
      width: 66px;
      height: 66px;
      background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
      border: 3px solid var(--border-dark);
      border-radius: 16px;
      box-shadow: 0 7px 0px var(--border-dark), 0 10px 12px rgba(0,0,0,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      font-weight: 900;
      color: #161a24;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
      cursor: pointer;
    }

    .keycap-3d::after {
      content: '';
      position: absolute;
      top: 4px;
      left: 6px;
      right: 6px;
      height: 12px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 8px;
    }

    .keycap-3d:hover {
      transform: translateY(-4px);
      box-shadow: 0 11px 0px var(--border-dark), 0 14px 16px rgba(0,0,0,0.16);
    }

    .keycap-3d:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0px var(--border-dark);
    }

    .keycap-3d.highlight {
      background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
      color: #ffffff;
      transform: translateY(-6px);
      box-shadow: 0 13px 0px var(--border-dark), 0 16px 20px rgba(37, 99, 235, 0.35);
    }

    .keycap-3d.found {
      background: linear-gradient(180deg, #10b981 0%, #047857 100%);
      color: #ffffff;
      transform: translateY(-8px) scale(1.06);
      box-shadow: 0 15px 0px var(--border-dark), 0 18px 22px rgba(16, 185, 129, 0.4);
    }

    .keycap-3d.deleting {
      background: linear-gradient(180deg, #f43f5e 0%, #be123c 100%);
      color: #ffffff;
      transform: translateY(6px) scale(0.6);
      box-shadow: 0 1px 0px var(--border-dark);
      opacity: 0;
    }

    /* Floating Index Pointer Tag */
    .pointer-callout {
      position: absolute;
      top: 0;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.2rem 0.55rem;
      background: #2563eb;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 900;
      font-family: 'JetBrains Mono', monospace;
      border: 2px solid var(--border-dark);
      border-radius: 8px;
      box-shadow: 2px 2px 0px var(--border-dark);
      animation: bouncePointer 0.8s infinite alternate ease-in-out;
      z-index: 10;
    }

    @keyframes bouncePointer {
      from { transform: translateY(0); }
      to   { transform: translateY(-4px); }
    }

    /* Linked List Capsule */
    .ll-capsule {
      display: flex;
      align-items: stretch;
      background: #ffffff;
      border: 3px solid var(--border-dark);
      border-radius: 16px;
      box-shadow: 0 6px 0px var(--border-dark);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .ll-capsule:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 0px var(--border-dark);
    }
    .ll-capsule.highlight {
      transform: translateY(-6px);
      border-color: #2563eb;
      box-shadow: 0 12px 0px #1e3a8a, 0 14px 15px rgba(37, 99, 235, 0.25);
    }
    .ll-val-box {
      padding: 0.75rem 1.15rem;
      font-size: 1.25rem;
      font-weight: 900;
      color: #161a24;
      background: #ffffff;
      min-width: 54px;
      text-align: center;
    }
    .ll-ptr-box {
      padding: 0.75rem 0.85rem;
      background: #f1f5f9;
      border-left: 3px solid var(--border-dark);
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      color: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Stack Physical Chute */
    .stack-chute {
      width: 300px;
      min-height: 290px;
      border: 4px solid var(--border-dark);
      border-top: none;
      border-radius: 0 0 22px 22px;
      background: #ffffff;
      box-shadow: inset 0 -12px 0px rgba(0,0,0,0.05), 4px 6px 0px var(--border-dark);
      display: flex;
      flex-direction: column-reverse;
      padding: 0.85rem 1.25rem;
      gap: 0.65rem;
    }

    .stack-plate {
      width: 100%;
      padding: 0.85rem;
      border: 3px solid var(--border-dark);
      border-radius: 12px;
      background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
      font-size: 1.15rem;
      font-weight: 900;
      text-align: center;
      box-shadow: 0 4px 0px var(--border-dark);
      animation: dropSlam 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      cursor: pointer;
      transition: all 0.15s;
    }
    .stack-plate:hover {
      transform: scale(1.02);
    }
    .stack-plate.is-top {
      background: linear-gradient(180deg, #c084fc 0%, #9333ea 100%);
      color: #ffffff;
      box-shadow: 0 6px 0px var(--border-dark);
    }

    /* Queue Conveyor */
    .conveyor-belt {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      padding: 1.75rem;
      background: #ffffff;
      border: 3px solid var(--border-dark);
      border-radius: 20px;
      box-shadow: 6px 6px 0px var(--border-dark);
      overflow-x: auto;
      min-height: 160px;
    }

    /* Mailbox Slot */
    .mailbox-slot {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.65rem 1rem;
      background: #ffffff;
      border: 2.5px solid var(--border-dark);
      border-radius: 14px;
      box-shadow: 3px 3px 0px var(--border-dark);
      transition: all 0.2s;
    }
    .mailbox-slot.active-slot {
      background: #fef08a;
      transform: translateX(4px);
    }

    /* Synchronized Code Line Highlight */
    .code-line {
      display: block;
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      transition: all 0.2s;
      line-height: 1.55;
    }
    .code-line.active-line {
      background: rgba(245, 158, 11, 0.25);
      border-left: 3.5px solid #f59e0b;
      color: #fbbf24;
      font-weight: 700;
    }

    @keyframes dropSlam {
      from { transform: translateY(-45px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body class="p-4 md:p-6 lg:p-8">

  <div class="max-w-7xl mx-auto flex flex-col lg:flex-row gap-6">

    <!-- ── Left Sidebar ── -->
    <aside class="w-full lg:w-72 flex flex-col gap-5 flex-shrink-0">
      
      <!-- Brand Poster Card -->
      <div class="neo-card p-5 bg-[#ffedd5] relative overflow-hidden">
        <div class="flex items-center gap-3.5">
          <div class="w-13 h-13 rounded-2xl bg-[#ff6b35] border-3 border-[#161a24] shadow-[0_4px_0_#161a24] flex items-center justify-center text-white font-black text-2xl tracking-tighter">
            DS
          </div>
          <div>
            <h1 class="text-xl font-black tracking-tight leading-none text-[#161a24]">OVERFLOW</h1>
            <p class="text-xs font-bold text-slate-700 tracking-wide mt-1">Data Structures Lab</p>
          </div>
        </div>

        <div class="mt-4 pt-3.5 border-t-2 border-[#161a24]/15 flex items-center justify-between">
          <!-- Audio Toggle Button -->
          <button id="sound-btn" onclick="toggleSound()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl border-2 border-[#161a24] bg-white text-xs font-mono font-bold shadow-[2px_2px_0_#161a24] cursor-pointer hover:bg-slate-50 transition-all active:translate-y-0.5">
            <span id="sound-icon">🔊</span>
            <span id="sound-text">SFX On</span>
          </button>
          <span class="bg-[#161a24] text-white px-2.5 py-1 rounded-full font-mono text-[0.7rem] font-black tracking-wider">PRO UX</span>
        </div>
      </div>

      <!-- Navigation Keycaps -->
      <div class="neo-card p-3.5 flex flex-col gap-2">
        <div class="px-2 py-1 text-[0.7rem] font-black uppercase tracking-wider text-slate-500">
          Select Structure
        </div>
        <button class="keycap-nav active" onclick="switchDS('array')">
          <span class="text-xl">🔢</span>
          <span>Array</span>
        </button>
        <button class="keycap-nav" onclick="switchDS('linkedlist')">
          <span class="text-xl">🔗</span>
          <span>Linked List</span>
        </button>
        <button class="keycap-nav" onclick="switchDS('stack')">
          <span class="text-xl">📚</span>
          <span>Stack (LIFO)</span>
        </button>
        <button class="keycap-nav" onclick="switchDS('queue')">
          <span class="text-xl">🚶</span>
          <span>Queue (FIFO)</span>
        </button>
        <button class="keycap-nav" onclick="switchDS('bst')">
          <span class="text-xl">🌳</span>
          <span>Binary Search Tree</span>
        </button>
        <button class="keycap-nav" onclick="switchDS('hashtable')">
          <span class="text-xl">🗂️</span>
          <span>Hash Table</span>
        </button>
      </div>

      <!-- UX Guidance: Click-to-Interact Hint -->
      <div class="neo-card-sm p-4 bg-[#e0f2fe] border-2 border-[#161a24]">
        <div class="flex items-center gap-1.5 font-black text-xs uppercase tracking-wider text-blue-900 mb-1">
          <span>👆 Direct Manipulation</span>
        </div>
        <p class="text-xs text-slate-700 leading-relaxed font-semibold">
          Click directly on <b>any keycap cell</b> in the canvas to inspect its memory address, value, or trigger instant actions!
        </p>
      </div>

    </aside>

    <!-- ── Main Workspace ── -->
    <main class="flex-1 flex flex-col gap-6">

      <!-- Header Bento Card -->
      <div class="neo-card p-6" id="ds-header-panel">
        <!-- Rendered by JS -->
      </div>

      <!-- Action Controls Bento Bar -->
      <div class="neo-card p-4 md:p-5" id="ds-controls-panel">
        <!-- Rendered by JS -->
      </div>

      <!-- Interactive 3D Canvas Area -->
      <div class="neo-card p-6 md:p-8 min-h-[300px] flex flex-col justify-center items-center relative overflow-hidden bg-white" id="ds-canvas-panel">
        <!-- Rendered by JS -->
      </div>

      <!-- Stepper Controls & Live Terminal Bar -->
      <div class="neo-card-sm p-4 bg-[#161a24] text-white flex flex-col md:flex-row md:items-center justify-between gap-4">
        
        <!-- Live status -->
        <div class="flex items-center gap-3 overflow-hidden flex-1">
          <div class="w-3 h-3 rounded-full bg-[#10b981] animate-ping flex-shrink-0"></div>
          <span class="text-xs font-mono font-bold text-yellow-400 flex-shrink-0">LIVE CONSOLE:</span>
          <span id="log-msg" class="text-xs font-mono text-slate-100 truncate">Ready! Click any keycap or operation above.</span>
        </div>

        <!-- Algorithmic Step Controller -->
        <div class="flex items-center gap-3 flex-shrink-0">
          <!-- Step Forward Button -->
          <button id="btn-step-fwd" onclick="stepForward()" disabled class="px-3.5 py-1.5 rounded-xl bg-slate-800 text-slate-300 font-mono text-xs font-bold border-2 border-slate-600 disabled:opacity-35 disabled:cursor-not-allowed hover:bg-slate-700 hover:text-white flex items-center gap-1.5 transition-all">
            <span>⏭️</span> Step Next
          </button>

          <div class="h-5 w-px bg-slate-700"></div>

          <!-- Speed Slider -->
          <div class="flex items-center gap-2">
            <span class="text-[0.7rem] font-mono text-slate-400 font-bold uppercase">Speed:</span>
            <select id="anim-speed" class="bg-[#242b38] border-2 border-slate-600 text-white text-xs rounded-xl px-2.5 py-1 font-mono font-bold outline-none cursor-pointer">
              <option value="900">Slow (0.5x)</option>
              <option value="450" selected>Normal (1x)</option>
              <option value="180">Fast (2x)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Bottom Split Guide & Code Inspection -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="ds-guide-panel">
        <!-- Rendered by JS -->
      </div>

    </main>

  </div>

  <script>
    /* ════════════════════════════════════════════════════
       AUDIO SYNTHESIZER (Web Audio API Keycap Click)
    ════════════════════════════════════════════════════ */
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
    }

    function playKeyClick(freq = 600, duration = 0.04) {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + duration);

        gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-icon').textContent = soundEnabled ? '🔊' : '🔇';
      document.getElementById('sound-text').textContent = soundEnabled ? 'SFX On' : 'Muted';
      if (soundEnabled) playKeyClick(800, 0.05);
    }

    /* ════════════════════════════════════════════════════
       DATA STRUCTURE CONFIGS & CODE
    ════════════════════════════════════════════════════ */
    const DS_CONFIG = {
      array: {
        title: "Array",
        icon: "🔢",
        tag: "Contiguous Memory Block",
        accent: "#ff6b35",
        bgTint: "#ffedd5",
        summary: "Arrays allocate unbroken, sequential slots in memory. Accessing any cell by its index [i] happens in instant O(1) time. Inserting or deleting in the middle requires shifting items, which takes O(n) time.",
        complexities: [
          { label: "Access: O(1)", bg: "#dcfce7", text: "#15803d" },
          { label: "Search: O(n)", bg: "#fef3c7", text: "#b45309" },
          { label: "Insert: O(n)", bg: "#fef3c7", text: "#b45309" },
          { label: "Delete: O(n)", bg: "#fee2e2", text: "#b91c1c" }
        ],
        presets: [
          { name: "Default (7 items)", data: [12, 45, 7, 23, 56, 8, 89] },
          { name: "Worst-Case Search", data: [10, 20, 30, 40, 50, 60, 99] },
          { name: "Ascending Sorted", data: [5, 12, 19, 28, 42, 56, 70] }
        ],
        steps: [
          { title: "Insert / Push", desc: "Adds an element to the next available index at the end of the array." },
          { title: "Delete by Index", desc: "Extracts an item from index [i]. Subsequent items slide left to fill the gap." },
          { title: "Linear Search", desc: "Scans sequentially index-by-index until the matching value is spotted." }
        ],
        codeLines: {
          insert: [
            "# 1. Check array capacity bounds",
            "arr.append(value)  # O(1) amortized",
            "# Element inserted at new tail index"
          ],
          search: [
            "for i in range(len(arr)):",
            "    if arr[i] == target:",
            "        return i  # Target Found at index [i]!",
            "return -1  # Target Not Found"
          ],
          delete: [
            "removed_val = arr[index]",
            "for j in range(index, len(arr) - 1):",
            "    arr[j] = arr[j + 1]  # Shift items left",
            "arr.pop()  # Shrink array length"
          ]
        }
      },

      linkedlist: {
        title: "Linked List",
        icon: "🔗",
        tag: "Chained Pointer Nodes",
        accent: "#2563eb",
        bgTint: "#dbeafe",
        summary: "Linked lists connect individual memory nodes together using pointers. Nodes can live anywhere in RAM. Inserting at the very front (HEAD) is instantaneous O(1) because zero elements need to shift.",
        complexities: [
          { label: "Access: O(n)", bg: "#fef3c7", text: "#b45309" },
          { label: "Search: O(n)", bg: "#fef3c7", text: "#b45309" },
          { label: "Insert Head: O(1)", bg: "#dcfce7", text: "#15803d" },
          { label: "Delete Head: O(1)", bg: "#dcfce7", text: "#15803d" }
        ],
        presets: [
          { name: "Default (4 nodes)", data: [18, 42, 9, 65] },
          { name: "Single Node", data: [42] },
          { name: "Chain of 6", data: [10, 20, 30, 40, 50, 60] }
        ],
        steps: [
          { title: "Insert Head", desc: "Creates a new node and points its 'next' reference directly to current HEAD in O(1)." },
          { title: "Insert Tail", desc: "Follows pointers down the chain to the last node whose next is NULL, then attaches the new node." },
          { title: "Delete Head", desc: "Simply repoints HEAD to HEAD.next. The unlinked node is freed instantly." }
        ],
        codeLines: {
          insert: [
            "new_node = Node(value)",

    // Linked List state
    class LLNode { constructor(v) { this.val = v; this.next = null; } }
    function buildLL(arr) {
      let h = null;
      for (let i = arr.length - 1; i >= 0; i--) {
        let n = new LLNode(arr[i]); n.next = h; h = n;
      }
      return h;
    }
    let llHead = buildLL([18, 42, 9, 65]);

    // Stack state
    let stackData = [14, 28, 55, 90];

    // Queue state
    let queueData = [15, 33, 72, 8];

    // BST state
    class BSTNode { constructor(v) { this.val = v; this.left = null; this.right = null; } }
    function bstInsert(r, v) {
      if (!r) return new BSTNode(v);
      if (v < r.val) r.left = bstInsert(r.left, v);
      else if (v > r.val) r.right = bstInsert(r.right, v);
      return r;
    }
    function buildBST(arr) {
      let r = null;
      arr.forEach(v => r = bstInsert(r, v));
      return r;
    }
    let bstRoot = buildBST([50, 25, 75, 12, 38, 60, 92]);

    // Hash table state
    const HT_SIZE = 5;
    let htBuckets = Array.from({ length: HT_SIZE }, () => []);
    function getHash(k) {
      let s = 0;
      for (let c of k) s = (s + c.charCodeAt(0)) % HT_SIZE;
      return s;
    }
    function initHT(data = null) {
      htBuckets = Array.from({ length: HT_SIZE }, () => []);
      const sample = data || [["user", "sui"], ["code", "rust"], ["tag", "web3"], ["mode", "fast"], ["zoom", "2x"]];
      sample.forEach(([k, v]) => htBuckets[getHash(k)].push({ k, v }));
    }
    initHT();

    /* ════════════════════════════════════════════════════

    function getDelay() {
      const el = document.getElementById('anim-speed');
      return el ? parseInt(el.value) : 450;
    }

    async function waitStep() {
      const btn = document.getElementById('btn-step-fwd');
      if (btn) btn.disabled = false;

      const delayMs = getDelay();
      return new Promise(resolve => {
        let timer = null;
        stepResolver = () => {
          clearTimeout(timer);
          if (btn) btn.disabled = true;
          stepResolver = null;
          resolve();
        };
        timer = setTimeout(() => {
          if (stepResolver) stepResolver();
        }, delayMs);
      });
    }

    function stepForward() {
      if (stepResolver) {
        playKeyClick(750, 0.03);
        stepResolver();
      }
    }

        while (curr) { nodes.push(curr.val); curr = curr.next; }

        if (nodes.length === 0) {
          panel.innerHTML = `<div class="font-bold text-slate-400 py-12">Linked list is empty (HEAD -> NULL).</div>`;
          return;
        }

        panel.innerHTML = `
          <div class="w-full flex items-center justify-center overflow-x-auto py-6">
            <div class="flex items-center gap-3 flex-nowrap px-4">
              <div class="px-3.5 py-1.5 rounded-xl bg-[#2563eb] text-white border-2 border-[#161a24] shadow-[3px_3px_0_#161a24] font-mono text-xs font-black">
                HEAD
              </div>
              <span class="text-2xl font-black text-slate-800">→</span>

              ${nodes.map((v, i) => `
                <div class="flex items-center gap-3">
                  <div onclick="LinkedListModule.inspect(${v})" class="ll-capsule ${v === highlightVal ? 'highlight' : ''}" title="Click to inspect node">
                    <div class="ll-val-box" style="${v === highlightVal ? 'background:#dbeafe;' : ''}">${v}</div>
                    <div class="ll-ptr-box">NEXT</div>
                  </div>
                  ${i < nodes.length - 1 ? `<span class="text-2xl font-black text-slate-800">→</span>` : ''}
                </div>
              `).join('')}

              <span class="text-2xl font-black text-slate-800">→</span>
              <div class="px-3.5 py-1.5 rounded-xl bg-[#f43f5e] text-white border-2 border-[#161a24] shadow-[3px_3px_0_#161a24] font-mono text-xs font-black">
                NULL
              </div>
            </div>
          </div>
        `;
      },

      inspect(val) {
        playKeyClick(600, 0.04);
        logMsg(`Inspected node with value <b>${val}</b>. Pointer links to next contiguous or scattered node.`, "🔗");
        this.renderCanvas(val);
      },

      insertHead() {
        playKeyClick(550, 0.05);
        const inp = document.getElementById('ll-val-in');
        const v = parseInt(inp.value);
        if (isNaN(v)) { logMsg("Enter a value.", "⚠️"); return; }
        const n = new LLNode(v);
        n.next = llHead;
        llHead = n;
        inp.value = '';
        setCodeLines(DS_CONFIG.linkedlist.codeLines.insert);
        highlightCodeLine(2);
        this.renderCanvas(v);
        logMsg(`Inserted node <b>${v}</b> at HEAD in instant <b>O(1)</b> time!`, "✅");
      },

      insertTail() {
        playKeyClick(550, 0.05);
        const inp = document.getElementById('ll-val-in');
        const v = parseInt(inp.value);
        if (isNaN(v)) { logMsg("Enter a value.", "⚠️"); return; }
        const n = new LLNode(v);
        if (!llHead) llHead = n;
        else {
          let c = llHead;
          while (c.next) c = c.next;
          c.next = n;
        }
        inp.value = '';
        this.renderCanvas(v);
        logMsg(`Traversed to end and hooked up node <b>${v}</b> at TAIL.`, "✅");
      },

      deleteHead() {
        playKeyClick(420, 0.05);
        if (!llHead) { logMsg("List is already empty.", "⚠️"); return; }
        setCodeLines(DS_CONFIG.linkedlist.codeLines.delete);
        highlightCodeLine(1);
        const val = llHead.val;
        llHead = llHead.next;
        this.renderCanvas();
        logMsg(`Deleted HEAD node <b>${val}</b> in O(1) time.`, "🗑️");
      },

      async search() {
        const inp = document.getElementById('ll-val-in');
        const v = parseInt(inp.value);
        if (isNaN(v)) { logMsg("Enter search value.", "⚠️"); return; }

        setLock(true);
        setCodeLines(DS_CONFIG.linkedlist.codeLines.search);
        let curr = llHead;
        let count = 0;

        while (curr) {
          highlightCodeLine(1);
          this.renderCanvas(curr.val);
          playKeyClick(520 + count * 40, 0.04);
          logMsg(`Traversing pointer node ${count}: comparing ${curr.val} === ${v}...`, "🔗");
          await waitStep();

          highlightCodeLine(2);
          if (curr.val === v) {
            playKeyClick(850, 0.1);
            logMsg(`Target node <b>${v}</b> found after ${count + 1} pointer steps!`, "🎯");
            setLock(false);
            return;
          }
          highlightCodeLine(3);
          curr = curr.next;
          count++;
        }

        highlightCodeLine(4);
        this.renderCanvas(null);
        setLock(false);
        logMsg(`Node <b>${v}</b> not found in linked chain.`, "❌");
      },

      reset() {
        playKeyClick(700, 0.05);
        llHead = buildLL([18, 42, 9, 65]);
        this.renderCanvas();
        logMsg("Linked list reset.", "↺");
      }
    };

    /* ════════════════════════════════════════════════════

    /* ════════════════════════════════════════════════════

    /* ════════════════════════════════════════════════════
       5. BST MODULE (Clickable Nodes & Path Step Tracing)
    ════════════════════════════════════════════════════ */
    const BSTModule = {
      renderControls() {
        document.getElementById('ds-controls-panel').innerHTML = `
          <div class="flex flex-wrap items-center gap-3">
            <input id="bst-val-in" type="number" placeholder="Value (e.g. 44)" class="neo-input w-36" onkeydown="if(event.key==='Enter') BSTModule.insert()" />
            <button class="key-btn key-btn-orange" onclick="BSTModule.insert()"><span class="text-base">➕</span> Insert</button>
            <button class="key-btn key-btn-blue" onclick="BSTModule.search()"><span class="text-base">🔍</span> Search Path</button>
            <button class="key-btn key-btn-yellow" onclick="BSTModule.inOrder()"><span class="text-base">📋</span> In-Order (Sorted)</button>
            <button class="key-btn key-btn-white" onclick="BSTModule.reset()"><span class="text-base">↺</span> Reset</button>
          </div>
        `;
      },

      renderCanvas(targetVal = null, pathVals = []) {
        const panel = document.getElementById('ds-canvas-panel');
        const W = 650;
        const H = 280;

        function calc(n, depth, l, r, map) {
          if (!n) return;
          const x = (l + r) / 2;
          const y = depth * 65 + 40;
          map[n.val] = { x, y, n };
          calc(n.left, depth + 1, l, x, map);
          calc(n.right, depth + 1, x, r, map);
        }

        const posMap = {};
        calc(bstRoot, 0, 0, W, posMap);

        let linesSvg = '';
        let nodesSvg = '';

        function drawLines(n) {
          if (!n) return;
          const cur = posMap[n.val];
          if (n.left) {
            const lc = posMap[n.left.val];
            linesSvg += `<line x1="${cur.x}" y1="${cur.y}" x2="${lc.x}" y2="${lc.y}" stroke="#161a24" stroke-width="3" />`;
            drawLines(n.left);
          }
          if (n.right) {
            const rc = posMap[n.right.val];
            linesSvg += `<line x1="${cur.x}" y1="${cur.y}" x2="${rc.x}" y2="${rc.y}" stroke="#161a24" stroke-width="3" />`;
            drawLines(n.right);
          }
        }
        drawLines(bstRoot);

        Object.values(posMap).forEach(({ x, y, n }) => {
          const isTarget = n.val === targetVal;
          const inPath = pathVals.includes(n.val);

          let fill = '#ffffff';
          let textColor = '#161a24';
          if (isTarget) { fill = '#10b981'; textColor = '#ffffff'; }
          else if (inPath) { fill = '#2563eb'; textColor = '#ffffff'; }

          nodesSvg += `
            <g transform="translate(${x},${y})" onclick="BSTModule.inspect(${n.val})" class="cursor-pointer">
              <circle r="22" cx="3" cy="3" fill="#161a24" />
              <circle r="22" fill="${fill}" stroke="#161a24" stroke-width="3" />
              <text text-anchor="middle" dy="5" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="900" fill="${textColor}">
                ${n.val}
              </text>
            </g>
          `;
        });

        panel.innerHTML = `
          <div class="w-full flex justify-center overflow-x-auto">
            <svg viewBox="0 0 ${W} ${H}" class="w-full max-w-2xl h-auto" style="min-height:260px;">
              ${linesSvg}
              ${nodesSvg}
            </svg>
          </div>
        `;
      },

      inspect(val) {
        playKeyClick(600, 0.04);
        logMsg(`Selected node <b>${val}</b>. Left children < ${val}, right children > ${val}.`, "🌳");
        const inp = document.getElementById('bst-val-in');
        if (inp) inp.value = val;
      },

      insert() {
        playKeyClick(550, 0.05);
        const inp = document.getElementById('bst-val-in');
        const v = parseInt(inp.value);
        if (isNaN(v)) { logMsg("Enter a number.", "⚠️"); return; }
        bstRoot = bstInsert(bstRoot, v);
        inp.value = '';
        this.renderCanvas(v);
        logMsg(`Inserted <b>${v}</b>: smaller branches left, larger branches right.`, "🌳");
      },

      async search() {
        const inp = document.getElementById('bst-val-in');
        const v = parseInt(inp.value);
        if (isNaN(v)) { logMsg("Enter search value.", "⚠️"); return; }

        setLock(true);
        setCodeLines(DS_CONFIG.bst.codeLines.search);
        let curr = bstRoot;
        let path = [];

        while (curr) {
          path.push(curr.val);
          this.renderCanvas(null, path);
          playKeyClick(500 + path.length * 50, 0.04);

          highlightCodeLine(1);
          if (curr.val === v) {
            playKeyClick(850, 0.1);
            this.renderCanvas(v, path);
            logMsg(`Found target <b>${v}</b> in <b>${path.length}</b> comparisons (O(log n))!`, "🎯");
            setLock(false);
            return;
          }

          if (v < curr.val) {
            highlightCodeLine(2);
            logMsg(`${v} < ${curr.val}: Branching LEFT (halving search space)...`, "🔍");
            curr = curr.left;
          } else {
            highlightCodeLine(3);
            logMsg(`${v} > ${curr.val}: Branching RIGHT (halving search space)...`, "🔍");
            curr = curr.right;
          }
          await waitStep();
        }

        highlightCodeLine(4);
        this.renderCanvas(null, path);
        setLock(false);
        logMsg(`Target ${v} is not in the tree.`, "❌");
      },

      async inOrder() {
        setLock(true);
        setCodeLines(DS_CONFIG.bst.codeLines.inorder);
        const sorted = [];
        const path = [];

        async function traverse(node) {
          if (!node) return;
          highlightCodeLine(2);
          await traverse(node.left);
          sorted.push(node.val);
          path.push(node.val);
          highlightCodeLine(3);
          BSTModule.renderCanvas(node.val, path);
          playKeyClick(500 + sorted.length * 30, 0.03);
          logMsg(`In-order traversal visited: [${sorted.join(', ')}]...`, "📋");
          await waitStep();
          highlightCodeLine(4);
          await traverse(node.right);
        }

        await traverse(bstRoot);
        setLock(false);
        logMsg(`In-order Complete: <b>[${sorted.join(', ')}]</b> — Perfectly sorted!`, "✅");
      },

      reset() {
        playKeyClick(700, 0.05);
        bstRoot = buildBST([50, 25, 75, 12, 38, 60, 92]);
        this.renderCanvas();
        logMsg("BST reset.", "↺");
      }
    };

    /* ════════════════════════════════════════════════════
       6. HASH TABLE MODULE
    ════════════════════════════════════════════════════ */
    const HashTableModule = {
      renderControls() {
        document.getElementById('ds-controls-panel').innerHTML = `
          <div class="flex flex-wrap items-center gap-3">
            <input id="ht-key-in" type="text" placeholder="Key (e.g. tag)" class="neo-input w-36" onkeydown="if(event.key==='Enter') HashTableModule.insert()" />
            <input id="ht-val-in" type="text" placeholder="Value (e.g. nft)" class="neo-input w-36" onkeydown="if(event.key==='Enter') HashTableModule.insert()" />
            <button class="key-btn key-btn-orange" onclick="HashTableModule.insert()"><span class="text-base">➕</span> Set Key</button>
            <button class="key-btn key-btn-blue" onclick="HashTableModule.lookup()"><span class="text-base">🔍</span> Lookup Key</button>
            <button class="key-btn key-btn-pink" onclick="HashTableModule.deleteKey()"><span class="text-base">🗑️</span> Delete Key</button>
            <button class="key-btn key-btn-white" onclick="HashTableModule.reset()"><span class="text-base">↺</span> Reset</button>
          </div>
        `;
      },

      renderCanvas(activeBucket = -1, targetKey = null) {
        const panel = document.getElementById('ds-canvas-panel');
        panel.innerHTML = `
          <div class="w-full max-w-2xl flex flex-col gap-3 py-2">
            <div class="flex items-center justify-between text-xs font-mono font-black text-slate-600 mb-1">
              <span>Mailbox Buckets = ${HT_SIZE}</span>
              <span class="bg-yellow-200 px-2 py-0.5 rounded border border-[#161a24]">hash(k) = sum(charCodes) % ${HT_SIZE}</span>
            </div>

            ${htBuckets.map((bucket, i) => `
              <div class="mailbox-slot ${i === activeBucket ? 'active-slot' : ''}">
                <div class="w-14 flex items-center justify-center py-1 rounded-lg bg-[#161a24] text-white font-mono text-xs font-black flex-shrink-0">
                  [${i}]
                </div>

                <div class="flex items-center gap-2 flex-wrap flex-1">
                  ${bucket.length === 0 ? `
                    <span class="text-xs font-mono text-slate-400 font-bold italic">Empty Mailbox Slot</span>
                  ` : bucket.map((item, j) => `
                    <div onclick="HashTableModule.inspect('${item.k}','${item.v}')" class="cursor-pointer inline-flex items-center gap-1.5 px-3 py-1 rounded-lg border-2 border-[#161a24] text-xs font-mono font-bold shadow-[2px_2px_0_#161a24] ${item.k === targetKey ? 'bg-blue-500 text-white' : 'bg-white text-[#161a24]'} hover:scale-105 transition-all">
                      <span class="font-black text-[#ff6b35]">${item.k}</span>:
                      <span>${item.v}</span>
                    </div>
                    ${j < bucket.length - 1 ? '<span class="font-black text-slate-600">→</span>' : ''}
                  `).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        `;
      },

      inspect(k, v) {
        playKeyClick(600, 0.04);
        logMsg(`Selected key <b>"${k}"</b> with value <b>"${v}"</b>.`, "🗂️");
        const kInp = document.getElementById('ht-key-in');
        const vInp = document.getElementById('ht-val-in');
        if (kInp) kInp.value = k;
        if (vInp) vInp.value = v;
      },

      insert() {
        playKeyClick(550, 0.05);
        const kInp = document.getElementById('ht-key-in');
        const vInp = document.getElementById('ht-val-in');
        const k = kInp.value.trim();
        const v = vInp.value.trim();
        if (!k || !v) { logMsg("Enter both a key and a value.", "⚠️"); return; }

        const idx = getHash(k);
        const bucket = htBuckets[idx];
        const existing = bucket.find(e => e.k === k);

        if (existing) {
          existing.v = v;
          logMsg(`Updated key "${k}" to "${v}" in bucket [${idx}].`, "🔄");
        } else {
          bucket.push({ k, v });
          logMsg(`Inserted "${k}": "${v}" into bucket [${idx}]. Hash index = ${idx}.`, "✅");
        }

        kInp.value = '';
        vInp.value = '';
        this.renderCanvas(idx, k);
      },

      async lookup() {
        const kInp = document.getElementById('ht-key-in');
        const k = kInp.value.trim();
        if (!k) { logMsg("Enter key to search.", "⚠️"); return; }

        setCodeLines(DS_CONFIG.hashtable.codeLines.lookup);
        highlightCodeLine(0);
        const idx = getHash(k);
        const bucket = htBuckets[idx];
        const found = bucket.find(e => e.k === k);

        this.renderCanvas(idx, found ? k : null);
        highlightCodeLine(2);
        playKeyClick(found ? 850 : 400, 0.06);

        if (found) {
          highlightCodeLine(3);
          logMsg(`Found "${k}" → "${found.v}" in bucket [${idx}]!`, "🎯");
        } else {
          highlightCodeLine(4);
          logMsg(`Key "${k}" not found in bucket [${idx}].`, "❌");
        }
      },

      deleteKey() {
        playKeyClick(420, 0.05);
        const kInp = document.getElementById('ht-key-in');
        const k = kInp.value.trim();
        if (!k) { logMsg("Enter key to delete.", "⚠️"); return; }

        const idx = getHash(k);
        const before = htBuckets[idx].length;
        htBuckets[idx] = htBuckets[idx].filter(e => e.k !== k);

        this.renderCanvas(idx);
        if (htBuckets[idx].length < before) logMsg(`Deleted key "${k}" from bucket [${idx}].`, "🗑️");
        else logMsg(`Key "${k}" not found.`, "❌");
      },

      reset() {
        playKeyClick(700, 0.05);
        initHT();
        this.renderCanvas();
        logMsg("Hash table reset.", "↺");
      }
    };

    /* ════════════════════════════════════════════════════
       MODULE REGISTRY
    ════════════════════════════════════════════════════ */
    const MODULES = {
      array: ArrayModule,
      linkedlist: LinkedListModule,
      stack: StackModule,
      queue: QueueModule,
      bst: BSTModule,
      hashtable: HashTableModule
    };

    function switchDS(ds) {
      if (isLocked) return;
      playKeyClick(700, 0.04);
      currentDS = ds;
      document.querySelectorAll('.keycap-nav').forEach(btn => {
        btn.classList.remove('active');
        if (btn.getAttribute('onclick').includes(ds)) btn.classList.add('active');
      });
      renderApp();
      logMsg(`Loaded ${DS_CONFIG[ds].title}. Tap any action or node to explore!`, "🚀");
    }

    // Initial render
    renderApp();
  </script>
</body>
</html>
