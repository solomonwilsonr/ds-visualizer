<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlgoStudio — Interactive Data Structures Lab</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      font-family: var(--font-sans);
    }

    .font-mono {
      font-family: var(--font-mono);
    }

    /* Subtle dot grid for studio canvas */
    .bg-dot-grid {
      background-color: #fafbfc;
      background-image: radial-gradient(#e2e8f0 1.2px, transparent 1.2px);
      background-size: 24px 24px;
    }

    /* Custom subtle shadows */
    .shadow-soft {
      box-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.04), 0 4px 12px -2px rgba(15, 23, 42, 0.05);
    }

    .shadow-card {
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.04), 0 8px 24px -4px rgba(15, 23, 42, 0.06);
    }

    .shadow-active {
      box-shadow: 0 0 0 2px #4f46e5, 0 8px 20px -4px rgba(79, 70, 229, 0.25);
    }

    /* Polished Array Cell */
    .arr-cell-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .arr-tile {
      width: 64px;
      height: 64px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      font-weight: 700;
      color: #0f172a;
      box-shadow: 0 2px 8px -1px rgba(15, 23, 42, 0.06), 0 1px 3px 0 rgba(15, 23, 42, 0.04);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
      position: relative;
    }

    .arr-tile:hover {
      border-color: #cbd5e1;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px -2px rgba(15, 23, 42, 0.1);
    }

    .arr-tile.active-scan {
      background: #4f46e5;
      color: #ffffff;
      border-color: #4338ca;
      transform: translateY(-6px) scale(1.05);
      box-shadow: 0 10px 25px -3px rgba(79, 70, 229, 0.35);
    }

    .arr-tile.found-match {
      background: #10b981;
      color: #ffffff;
      border-color: #059669;
      transform: translateY(-8px) scale(1.08);
      box-shadow: 0 12px 28px -3px rgba(16, 185, 129, 0.4);
    }

    .arr-tile.removing {
      background: #f43f5e;
      color: #ffffff;
      transform: scale(0.6);
      opacity: 0;
    }

    /* Linked List Node */
    .ll-node-box {
      display: flex;
      align-items: stretch;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px -1px rgba(15, 23, 42, 0.06);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .ll-node-box:hover {
      border-color: #cbd5e1;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px -2px rgba(15, 23, 42, 0.1);
    }

    .ll-node-box.highlight {
      border-color: #4f46e5;
      transform: translateY(-4px);
      box-shadow: 0 0 0 2px #4f46e5, 0 10px 20px -3px rgba(79, 70, 229, 0.2);
    }

    /* Stack Container */
    .stack-chamber {
      width: 260px;
      min-height: 280px;
      border: 2px dashed #cbd5e1;
      border-top: none;
      border-radius: 0 0 16px 16px;
      background: #f8fafc;
      display: flex;
      flex-direction: column-reverse;
      padding: 1rem;
      gap: 0.6rem;
    }

    .stack-slab {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-weight: 700;
      text-align: center;
      color: #0f172a;
      box-shadow: 0 2px 4px rgba(15, 23, 42, 0.04);
      animation: dropSlam 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
      transition: all 0.15s;
    }

    .stack-slab:hover {
      border-color: #cbd5e1;
      transform: scale(1.02);
    }

    .stack-slab.is-top {
      background: #4f46e5;
      color: #ffffff;
      border-color: #4338ca;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    /* Code Highlighting */
    .code-line {
      display: block;
      padding: 0.2rem 0.75rem;
      border-radius: 4px;
      transition: background 0.15s;
      line-height: 1.6;
    }

    .code-line.active-line {
      background: rgba(99, 102, 241, 0.2);
      border-left: 3px solid #818cf8;
      color: #ffffff;
      font-weight: 600;
    }

    @keyframes dropSlam {
      from { transform: translateY(-30px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body class="h-full flex flex-col bg-dot-grid text-slate-900 antialiased selection:bg-indigo-500 selection:text-white">

  <!-- ══════════════════════════════════════════════════════════
       TOP NAVIGATION BAR
  ══════════════════════════════════════════════════════════ -->
  <header class="h-16 border-b border-slate-200/80 bg-white/80 backdrop-blur-md sticky top-0 z-30 flex items-center justify-between px-6">
    
    <!-- Brand -->
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-slate-900 flex items-center justify-center text-white font-bold text-sm shadow-sm">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5" />
        </svg>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-sm font-bold tracking-tight text-slate-900">AlgoStudio</h1>
          <span class="text-[0.65rem] font-semibold uppercase tracking-wider px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200">Interactive Lab</span>
        </div>
      </div>
    </div>

    <!-- Segmented Navigation -->
    <nav class="hidden md:flex items-center p-1 rounded-xl bg-slate-100 border border-slate-200/80 text-xs font-semibold text-slate-600">
      <button class="nav-btn px-3 py-1.5 rounded-lg transition-all text-slate-900 bg-white shadow-sm" onclick="switchDS('array')">Array</button>
      <button class="nav-btn px-3 py-1.5 rounded-lg transition-all hover:text-slate-900" onclick="switchDS('linkedlist')">Linked List</button>
      <button class="nav-btn px-3 py-1.5 rounded-lg transition-all hover:text-slate-900" onclick="switchDS('stack')">Stack</button>
      <button class="nav-btn px-3 py-1.5 rounded-lg transition-all hover:text-slate-900" onclick="switchDS('queue')">Queue</button>
      <button class="nav-btn px-3 py-1.5 rounded-lg transition-all hover:text-slate-900" onclick="switchDS('bst')">Binary Search Tree</button>
      <button class="nav-btn px-3 py-1.5 rounded-lg transition-all hover:text-slate-900" onclick="switchDS('hashtable')">Hash Table</button>
    </nav>

    <!-- Header Actions -->
    <div class="flex items-center gap-2.5">
      <!-- Audio Switch -->
      <button id="sound-btn" onclick="toggleSound()" class="h-9 px-3 rounded-lg border border-slate-200 hover:bg-slate-50 text-xs font-medium text-slate-700 flex items-center gap-1.5 transition-all">
        <span id="sound-icon">🔊</span>
        <span id="sound-text" class="hidden sm:inline">Audio</span>
      </button>

      <!-- GitHub Link -->
      <a href="https://github.com/solomonwilsonr/ds-visualizer" target="_blank" rel="noopener" class="h-9 px-3 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold flex items-center gap-1.5 transition-all shadow-sm">
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        <span>GitHub</span>
      </a>
    </div>

  </header>

  <!-- Mobile Segmented Navigation -->
  <div class="md:hidden overflow-x-auto p-2 bg-slate-100 border-b border-slate-200 flex gap-1">
    <button class="nav-btn text-xs px-3 py-1.5 rounded-lg bg-white shadow-sm font-semibold" onclick="switchDS('array')">Array</button>
    <button class="nav-btn text-xs px-3 py-1.5 rounded-lg font-medium text-slate-600" onclick="switchDS('linkedlist')">Linked List</button>
    <button class="nav-btn text-xs px-3 py-1.5 rounded-lg font-medium text-slate-600" onclick="switchDS('stack')">Stack</button>
    <button class="nav-btn text-xs px-3 py-1.5 rounded-lg font-medium text-slate-600" onclick="switchDS('queue')">Queue</button>
    <button class="nav-btn text-xs px-3 py-1.5 rounded-lg font-medium text-slate-600" onclick="switchDS('bst')">BST</button>
    <button class="nav-btn text-xs px-3 py-1.5 rounded-lg font-medium text-slate-600" onclick="switchDS('hashtable')">Hash Table</button>
  </div>

  <!-- ══════════════════════════════════════════════════════════
       MAIN CONTENT CONTAINER
  ══════════════════════════════════════════════════════════ -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-6 md:p-8 flex flex-col gap-6">

    <!-- Structure Overview & Complexity Card -->
    <section class="bg-white rounded-2xl border border-slate-200/80 p-6 shadow-soft" id="ds-hero-card">
      <!-- Rendered by JS -->
    </section>

    <!-- Action Toolbar (Operations & Presets) -->
    <section class="bg-white rounded-2xl border border-slate-200/80 p-4 shadow-soft flex flex-col gap-3" id="ds-toolbar-card">
      <!-- Rendered by JS -->
    </section>

    <!-- Visual Interactive Stage -->
    <section class="bg-white rounded-2xl border border-slate-200/80 p-8 min-h-[340px] flex flex-col justify-center items-center relative shadow-soft overflow-hidden" id="ds-stage-card">
      <!-- Rendered by JS -->
    </section>

    <!-- Live Execution Console & Playback Controls -->
    <section class="bg-slate-900 rounded-2xl border border-slate-800 p-4 text-white flex flex-col md:flex-row items-center justify-between gap-4 shadow-soft">
      <!-- Live Log Message -->
      <div class="flex items-center gap-3 overflow-hidden w-full md:w-auto">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse flex-shrink-0"></span>
        <span class="text-xs font-mono font-semibold text-slate-400 flex-shrink-0">CONSOLE:</span>
        <span id="log-msg" class="text-xs font-mono text-slate-200 truncate">Ready. Select an operation or preset above to begin.</span>
      </div>

      <!-- Player Controls -->
      <div class="flex items-center gap-3 flex-shrink-0">
        <!-- Manual Step Button -->
        <button id="btn-step-fwd" onclick="stepForward()" disabled class="h-8 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium border border-slate-700 disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1.5 transition-all">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
          </svg>
          <span>Step Next</span>
        </button>

        <div class="h-4 w-px bg-slate-700"></div>

        <!-- Speed Dropdown -->
        <div class="flex items-center gap-2">
          <span class="text-xs font-mono text-slate-400 font-medium">Speed:</span>
          <select id="anim-speed" class="h-8 bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg px-2.5 font-mono font-medium outline-none cursor-pointer">
            <option value="900">Slow (0.5x)</option>
            <option value="450" selected>Normal (1x)</option>
            <option value="180">Fast (2x)</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Bottom Split: Step Guide & Code Tracing -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6" id="ds-details-grid">
      <!-- Rendered by JS -->
    </div>

  </main>

  <script>
    /* ══════════════════════════════════════════════════════════
       AUDIO SYNTHESIZER (Polished subtle click)
    ══════════════════════════════════════════════════════════ */
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
    }

    function playKeyClick(freq = 600, duration = 0.04) {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + duration);

        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-icon').textContent = soundEnabled ? '🔊' : '🔇';
      document.getElementById('sound-text').textContent = soundEnabled ? 'Audio' : 'Muted';
      if (soundEnabled) playKeyClick(800, 0.04);
    }

    /* ══════════════════════════════════════════════════════════
       DATA STRUCTURES METADATA & CONFIG
    ══════════════════════════════════════════════════════════ */
    const DS_CONFIG = {
      array: {
        title: "Array",
        typeTag: "Linear Contiguous Memory",
        summary: "Arrays allocate unbroken, sequential address blocks in memory. Element lookup by numeric index is instantaneous O(1). Inserting or deleting items in the middle requires shifting trailing elements in O(n) time.",
        complexities: [
          { label: "Access", value: "O(1)", badge: "bg-emerald-50 text-emerald-700 border-emerald-200" },
          { label: "Search", value: "O(n)", badge: "bg-amber-50 text-amber-700 border-amber-200" },
          { label: "Insert", value: "O(n)", badge: "bg-amber-50 text-amber-700 border-amber-200" },
          { label: "Delete", value: "O(n)", badge: "bg-rose-50 text-rose-700 border-rose-200" }
        ],
        presets: [
          { name: "Default (7)", data: [12, 45, 7, 23, 56, 8, 89] },
          { name: "Worst-Case Scan", data: [10, 20, 30, 40, 50, 60, 99] },
          { name: "Sorted Sequence", data: [4, 11, 19, 28, 42, 65, 80] }
        ],
        steps: [
          { title: "Direct Index Access", desc: "Memory address = base + (index * size), executed in a single CPU instruction O(1)." },
          { title: "Push / Insert", desc: "Appends element at the next free index or slides downstream elements right to insert." },
          { title: "Delete by Index", desc: "Removes target index and slides subsequent elements left by one position in O(n)." }
        ],
        codeLines: {
          search: [
            "def linear_search(arr, target):",
            "    for i in range(len(arr)):",
            "        if arr[i] == target:",
            "            return i  # Match found at index i",
            "    return -1  # Target not in array"
          ],
          insert: [
            "# Append at tail (O(1) amortized)",
            "arr.append(value)",
            "# Array length updated"
          ],
          delete: [
            "removed_item = arr[index]",
            "for j in range(index, len(arr) - 1):",
            "    arr[j] = arr[j + 1]  # Shift elements left",
            "arr.pop()"
          ]
        }
      },

      linkedlist: {
        title: "Singly Linked List",
        typeTag: "Node Pointer Chain",
        summary: "Linked lists chain individual node objects containing a payload value and a reference pointer to the next node. Nodes can be allocated anywhere in memory. Inserting or deleting at the HEAD is an instant O(1) pointer swap.",
        complexities: [
          { label: "Access", value: "O(n)", badge: "bg-amber-50 text-amber-700 border-amber-200" },
          { label: "Search", value: "O(n)", badge: "bg-amber-50 text-amber-700 border-amber-200" },
          { label: "Insert Head", value: "O(1)", badge: "bg-emerald-50 text-emerald-700 border-emerald-200" },
          { label: "Delete Head", value: "O(1)", badge: "bg-emerald-50 text-emerald-700 border-emerald-200" }
        ],
        presets: [
          { name: "Default (4 Nodes)", data: [18, 42, 9, 65] },
          { name: "Single Node", data: [50] },
          { name: "Chain of 6", data: [10, 20, 30, 40, 50, 60] }
        ],
        steps: [
          { title: "Insert Head", desc: "Instantiates a new node, points its next reference to the existing HEAD, and updates HEAD in O(1)." },
          { title: "Insert Tail", desc: "Traverses to the node whose next pointer is NULL, linking the new node in O(n)." },
          { title: "Delete Head", desc: "Repoints HEAD to HEAD.next. The detached node is automatically garbage collected." }
        ],
        codeLines: {
          search: [
            "curr = head",
            "while curr is not None:",
            "    if curr.val == target:",
            "        return True  # Found matching node",
            "    curr = curr.next",
            "return False"
          ],
          insert: [
            "new_node = Node(value)",
            "new_node.next = head",
            "head = new_node  # O(1) Head assignment"
          ],
          delete: [
            "if not head: return None",
            "head = head.next  # Unlink first node in O(1)",
            "return head"
          ]
        }
      },

      stack: {
        title: "Stack",
        typeTag: "LIFO Container",
        summary: "Follows Last-In, First-Out (LIFO) semantics. Elements are pushed and popped exclusively from the top of the stack. Crucial for execution call stacks, parenthesis matching, and undo/redo operations.",
        complexities: [
          { label: "Push", value: "O(1)", badge: "bg-emerald-50 text-emerald-700 border-emerald-200" },
          { label: "Pop", value: "O(1)", badge: "bg-emerald-50 text-emerald-700 border-emerald-200" },
          { label: "Peek", value: "O(1)", badge: "bg-emerald-50 text-emerald-700 border-emerald-200" },
          { label: "Search", value: "O(n)", badge: "bg-amber-50 text-amber-700 border-amber-200" }
        ],
        presets: [
          { name: "Default Stack (4)", data: [14, 28, 55, 90] },
          { name: "Full Stack (5)", data: [10, 20, 30, 40, 50] },
          { name: "Empty Chute", data: [] }
        ],
        steps: [
          { title: "Push", desc: "Places an item directly on top of the stack. Stack depth increments by 1." },
          { title: "Pop", desc: "Removes and returns the topmost item in instant O(1) time." },
          { title: "Peek", desc: "Reads the current top element without altering the stack." }
        ],
        codeLines: {
          push: [
            "stack.append(value)  # Push to TOP",
            "top_pointer = len(stack) - 1"
          ],
          pop: [
            "if len(stack) == 0: raise UnderflowError",
            "return stack.pop()  # O(1) Pop"
          ],
          peek: [
            "if len(stack) == 0: return None",
            "return stack[-1]  # Inspect TOP"
          ]
        }
      },

      queue: {
        title: "Queue",
        typeTag: "FIFO Pipeline",
        summary: "Follows First-In, First-Out (FIFO) semantics. Elements enter at the REAR (Enqueue) and leave from the FRONT (Dequeue). Essential for BFS graph traversals, print queues, and task scheduling.",
        complexities: [
          { label: "Enqueue", value: "O(1)", badge: "bg-emerald-50 text-emerald-700 border-emerald-200" },
          { label: "Dequeue", value: "O(1)", badge: "bg-emerald-50 text-emerald-700 border-emerald-200" },
          { label: "Peek", value: "O(1)", badge: "bg-emerald-50 text-emerald-700 border-emerald-200" },
          { label: "Search", value: "O(n)", badge: "bg-amber-50 text-amber-700 border-amber-200" }
        ],
        presets: [
          { name: "Standard (4)", data: [15, 33, 72, 8] },
          { name: "Single Item", data: [99] },
          { name: "Busy Line (6)", data: [5, 10, 15, 20, 25, 30] }
        ],
        steps: [
          { title: "Enqueue (Rear)", desc: "Appends the new element to the back of the queue." },
          { title: "Dequeue (Front)", desc: "Serves and removes the front-most element in FIFO order." },
          { title: "Peek", desc: "Inspects the next element to be dequeued without removing it." }
        ],
        codeLines: {
          enqueue: [
            "queue.append(value)  # Enqueue to REAR",
            "rear_index = len(queue) - 1"
          ],
          dequeue: [
            "if len(queue) == 0: raise EmptyQueueError",
            "return queue.pop(0)  # Dequeue from FRONT"
          ]
        }
      },

      bst: {
        title: "Binary Search Tree",
        typeTag: "Hierarchical Search Tree",
        summary: "Every node holds at most two children. The left child must have a value strictly less than the node, and the right child strictly greater. In-order traversal visits nodes in perfectly sorted order.",
        complexities: [
          { label: "Search", value: "O(log n)", badge: "bg-emerald-50 text-emerald-700 border-emerald-200" },
          { label: "Insert", value: "O(log n)", badge: "bg-emerald-50 text-emerald-700 border-emerald-200" },
          { label: "Delete", value: "O(log n)", badge: "bg-emerald-50 text-emerald-700 border-emerald-200" },
          { label: "Worst Case", value: "O(n)", badge: "bg-rose-50 text-rose-700 border-rose-200" }
        ],
        presets: [
          { name: "Balanced (7)", data: [50, 25, 75, 12, 38, 60, 92] },
          { name: "Left Skewed", data: [70, 50, 40, 30, 20] },
          { name: "Right Skewed", data: [20, 30, 40, 50, 70] }
        ],
        steps: [
          { title: "Binary Search", desc: "Compares target against root: move Left if smaller, Right if larger. Halves search space each step." },
          { title: "Insert", desc: "Navigates down the comparison path and binds the new node to an empty leaf position." },
          { title: "In-Order Walk", desc: "Recursively visits Left Subtree -> Node -> Right Subtree, printing items in ascending order." }
        ],
        codeLines: {
          search: [
            "while curr is not None:",
            "    if target == curr.val: return curr",
            "    elif target < curr.val: curr = curr.left",
            "    else: curr = curr.right",
            "return None  # Value not in tree"
          ],
          inorder: [
            "def in_order(node):",
            "    if not node: return",
            "    in_order(node.left)    # Visit Left",
            "    visit(node.val)         # Visit Current Node",
            "    in_order(node.right)   # Visit Right"
          ]
        }
      },

      hashtable: {
        title: "Hash Table",
        typeTag: "Associative Key-Value Map",
        summary: "Uses a deterministic mathematical hash function to convert string keys into numeric bucket indices. In this implementation, collisions are resolved via Separate Chaining within each bucket array.",
        complexities: [
          { label: "Lookup", value: "O(1) avg", badge: "bg-emerald-50 text-emerald-700 border-emerald-200" },
          { label: "Insert", value: "O(1) avg", badge: "bg-emerald-50 text-emerald-700 border-emerald-200" },
          { label: "Delete", value: "O(1) avg", badge: "bg-emerald-50 text-emerald-700 border-emerald-200" },

        ],
        steps: [
          { title: "Hash Calculation", desc: "Converts key string characters to numeric ASCII codes: index = sum(charCodes) % bucketCount." },
          { title: "Bucket Lookup", desc: "Jumps directly to bucket[index] in O(1) time." },
          { title: "Separate Chaining", desc: "If keys collide on the same bucket, they form an inline chained list." }
        ],
        codeLines: {
          lookup: [
            "bucket_index = hash(key) % NUM_BUCKETS",
            "bucket = buckets[bucket_index]",
            "for entry in bucket:",
            "    if entry.key == key: return entry.val",
            "return None  # Key not found"

    /* ══════════════════════════════════════════════════════════
       STATE REPOSITORIES
    ══════════════════════════════════════════════════════════ */
    let currentDS = 'array';
    let isLocked = false;
    let stepResolver = null;

    // Array state
    let arrData = [12, 45, 7, 23, 56, 8, 89];

    // Linked list state
    class LLNode { constructor(v) { this.val = v; this.next = null; } }
    function buildLL(arr) {
      let h = null;
      for (let i = arr.length - 1; i >= 0; i--) {
        let n = new LLNode(arr[i]); n.next = h; h = n;
      }
      return h;
    }
    let llHead = buildLL([18, 42, 9, 65]);

    // Stack state
    let stackData = [14, 28, 55, 90];

    // Queue state
    let queueData = [15, 33, 72, 8];

    // BST state
    class BSTNode { constructor(v) { this.val = v; this.left = null; this.right = null; } }
    function bstInsert(r, v) {
      if (!r) return new BSTNode(v);
      if (v < r.val) r.left = bstInsert(r.left, v);
      else if (v > r.val) r.right = bstInsert(r.right, v);
      return r;
    }
    function buildBST(arr) {
      let r = null;
      arr.forEach(v => r = bstInsert(r, v));
      return r;
    }
    let bstRoot = buildBST([50, 25, 75, 12, 38, 60, 92]);

    // Hash table state
    const HT_SIZE = 5;
    let htBuckets = Array.from({ length: HT_SIZE }, () => []);
    function getHash(k) {
      let s = 0;
      for (let c of k) s = (s + c.charCodeAt(0)) % HT_SIZE;
      return s;
    }
    function initHT(data = null) {
      htBuckets = Array.from({ length: HT_SIZE }, () => []);
      const sample = data || [["user", "alex"], ["role", "admin"], ["team", "core"], ["mode", "fast"], ["zoom", "100%"]];
      sample.forEach(([k, v]) => htBuckets[getHash(k)].push({ k, v }));
    }
    initHT();

    /* ══════════════════════════════════════════════════════════
       STEPPER ENGINE & HELPERS
    ══════════════════════════════════════════════════════════ */
    function getDelay() {
      const el = document.getElementById('anim-speed');
      return el ? parseInt(el.value) : 450;
    }

    async function waitStep() {
      const btn = document.getElementById('btn-step-fwd');
      if (btn) btn.disabled = false;

      const delayMs = getDelay();
      return new Promise(resolve => {
        let timer = null;
        stepResolver = () => {
          clearTimeout(timer);
          if (btn) btn.disabled = true;
          stepResolver = null;
          resolve();
        };
        timer = setTimeout(() => {
          if (stepResolver) stepResolver();
        }, delayMs);
      });
    }

    function stepForward() {
      if (stepResolver) {
        playKeyClick(750, 0.03);
        stepResolver();
      }
    }

    function logMsg(msg) {
      const el = document.getElementById('log-msg');
      if (el) el.innerHTML = msg;
    }

    function highlightCodeLine(lineIdx) {
      document.querySelectorAll('.code-line').forEach((el, i) => {
        if (i === lineIdx) el.classList.add('active-line');
        else el.classList.remove('active-line');
      });
    }

    function setLock(locked) {
      isLocked = locked;
      document.querySelectorAll('input, button').forEach(b => {
        if (!b.id.includes('anim-speed') && b.id !== 'btn-step-fwd' && !b.classList.contains('nav-btn')) {
          b.disabled = locked;
        }
      });
    }

    /* ══════════════════════════════════════════════════════════
       MAIN RENDER DISPATCHER

    function setCodeLines(lines) {

    function loadPreset(idx) {
      playKeyClick(700, 0.04);

      else if (currentDS === 'stack') stackData = [...preset.data];
      else if (currentDS === 'queue') queueData = [...preset.data];
      else if (currentDS === 'bst') bstRoot = buildBST(preset.data);

    /* ══════════════════════════════════════════════════════════
       1. ARRAY MODULE
    ══════════════════════════════════════════════════════════ */
    const ArrayModule = {

        playKeyClick(650, 0.03);

        const inp = document.getElementById('arr-idx-in');

      insert() {
        playKeyClick(550, 0.04);
        const inp = document.getElementById('arr-val-in');

        setCodeLines(DS_CONFIG.array.codeLines.insert);
        highlightCodeLine(1);

      async deleteIdx() {
        playKeyClick(400, 0.05);
        const inp = document.getElementById('arr-idx-in');
        const idx = parseInt(inp.value);
        if (isNaN(idx) || idx < 0 || idx >= arrData.length) {
          logMsg(`Invalid index. Must be between 0 and ${arrData.length - 1}.`);
          return;
        }

        setCodeLines(DS_CONFIG.array.codeLines.delete);
        highlightCodeLine(0);
        const el = document.getElementById(`arr-cell-${idx}`);
        if (el) el.className = "arr-tile removing";
        logMsg(`Removing index [${idx}]... shifting remaining elements left.`);
        await sleep(300);

        highlightCodeLine(2);
        const removed = arrData.splice(idx, 1)[0];
        inp.value = '';
        this.renderCanvas();
        highlightCodeLine(3);
        setLock(false);
        logMsg(`Removed <b>${removed}</b>. Trailing elements shifted left in O(n) time.`);

        const inp = document.getElementById('arr-val-in');

        setLock(true);

          logMsg(`Checking index [${i}] -> compare ${arrData[i]} === ${v}...`);

        setLock(false);

        logMsg(`Inserted node <b>${v}</b> at HEAD in instant O(1) time.`);
      },

      insertTail() {
        playKeyClick(550, 0.04);
        const inp = document.getElementById('ll-val-in');
        const v = parseInt(inp.value);
        if (isNaN(v)) { logMsg("Please enter a numeric value."); return; }
        const n = new LLNode(v);
        if (!llHead) llHead = n;
        else {
          let c = llHead;
          while (c.next) c = c.next;
          c.next = n;
        }
        inp.value = '';
        this.renderCanvas(v);
        logMsg(`Traversed to end and appended node <b>${v}</b> at TAIL.`);
      },

      deleteHead() {
        playKeyClick(420, 0.04);
        if (!llHead) { logMsg("List is empty. Nothing to delete."); return; }
        setCodeLines(DS_CONFIG.linkedlist.codeLines.delete);

        const val = llHead.val;
        llHead = llHead.next;

        logMsg(`Deleted HEAD node <b>${val}</b> in O(1) time.`);

          highlightCodeLine(4);
          curr = curr.next;
          count++;

        this.renderCanvas(null);
        setLock(false);
        logMsg(`Node <b>${v}</b> was not found in the linked list.`);

        playKeyClick(700, 0.04);
        llHead = buildLL([18, 42, 9, 65]);
        this.renderCanvas();
        logMsg("Linked list reset to default chain.");
      }

    /* ══════════════════════════════════════════════════════════
       5. BST MODULE
    ══════════════════════════════════════════════════════════ */
    const BSTModule = {
      renderControls() {
        const presets = DS_CONFIG.bst.presets;
        document.getElementById('ds-toolbar-card').innerHTML = `
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex flex-wrap items-center gap-2.5">
              <input id="bst-val-in" type="number" placeholder="Node Value" class="h-9 w-28 px-3 rounded-lg border border-slate-200 text-xs font-medium outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" onkeydown="if(event.key==='Enter') BSTModule.insert()" />
              <button class="h-9 px-3.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold shadow-sm transition-all" onclick="BSTModule.insert()">
                Insert
              </button>
              <button class="h-9 px-3.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold shadow-sm transition-all" onclick="BSTModule.search()">
                Search Path
              </button>
              <button class="h-9 px-3 rounded-lg border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-medium transition-all" onclick="BSTModule.inOrder()">
                In-Order (Sorted)
              </button>
              <button class="h-9 px-3 rounded-lg border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-medium transition-all" onclick="BSTModule.reset()">
                Reset
              </button>
            </div>

            <div class="flex items-center gap-1.5 flex-shrink-0">
              <span class="text-xs font-medium text-slate-400 mr-1">Presets:</span>
              ${presets.map((p, i) => `
                <button onclick="loadPreset(${i})" class="h-8 px-2.5 rounded-lg bg-slate-50 hover:bg-slate-100 border border-slate-200 text-[0.75rem] font-medium text-slate-700 transition-all">
                  ${p.name}
                </button>
              `).join('')}
            </div>
          </div>
        `;
      },

      renderCanvas(targetVal = null, pathVals = []) {
        const stage = document.getElementById('ds-stage-card');
        const W = 650;
        const H = 280;

        function calc(n, depth, l, r, map) {
          if (!n) return;
          const x = (l + r) / 2;
          const y = depth * 65 + 40;
          map[n.val] = { x, y, n };
          calc(n.left, depth + 1, l, x, map);
          calc(n.right, depth + 1, x, r, map);
        }

        const posMap = {};
        calc(bstRoot, 0, 0, W, posMap);

        let linesSvg = '';
        let nodesSvg = '';

        function drawLines(n) {
          if (!n) return;
          const cur = posMap[n.val];
          if (n.left) {
            const lc = posMap[n.left.val];
            linesSvg += `<line x1="${cur.x}" y1="${cur.y}" x2="${lc.x}" y2="${lc.y}" stroke="#cbd5e1" stroke-width="2" />`;
            drawLines(n.left);
          }
          if (n.right) {
            const rc = posMap[n.right.val];
            linesSvg += `<line x1="${cur.x}" y1="${cur.y}" x2="${rc.x}" y2="${rc.y}" stroke="#cbd5e1" stroke-width="2" />`;
            drawLines(n.right);
          }
        }
        drawLines(bstRoot);

        Object.values(posMap).forEach(({ x, y, n }) => {
          const isTarget = n.val === targetVal;
          const inPath = pathVals.includes(n.val);

          let fill = '#ffffff';
          let stroke = '#cbd5e1';
          let textColor = '#0f172a';

          if (isTarget) {
            fill = '#10b981';
            stroke = '#059669';
            textColor = '#ffffff';
          } else if (inPath) {
            fill = '#4f46e5';
            stroke = '#4338ca';
            textColor = '#ffffff';
          }

          nodesSvg += `
            <g transform="translate(${x},${y})" onclick="BSTModule.inspect(${n.val})" class="cursor-pointer">
              <circle r="22" fill="${fill}" stroke="${stroke}" stroke-width="2.5" />
              <text text-anchor="middle" dy="5" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="${textColor}">
                ${n.val}
              </text>
            </g>
          `;
        });

        stage.innerHTML = `
          <div class="w-full flex justify-center overflow-x-auto">
            <svg viewBox="0 0 ${W} ${H}" class="w-full max-w-2xl h-auto" style="min-height:260px;">
              ${linesSvg}
              ${nodesSvg}
            </svg>
          </div>
        `;
      },

      inspect(val) {
        playKeyClick(600, 0.03);
        logMsg(`Selected node <b>${val}</b>. Left subtree < ${val}, Right subtree > ${val}.`);
        const inp = document.getElementById('bst-val-in');
        if (inp) inp.value = val;
      },

      insert() {
        playKeyClick(550, 0.04);
        const inp = document.getElementById('bst-val-in');
        const v = parseInt(inp.value);
        if (isNaN(v)) { logMsg("Please enter a numeric node value."); return; }
        bstRoot = bstInsert(bstRoot, v);
        inp.value = '';
        this.renderCanvas(v);
        logMsg(`Inserted node <b>${v}</b> into BST.`);
      },

      async search() {
        const inp = document.getElementById('bst-val-in');
        const v = parseInt(inp.value);
        if (isNaN(v)) { logMsg("Enter search target value."); return; }

        setLock(true);
        setCodeLines(DS_CONFIG.bst.codeLines.search);
        let curr = bstRoot;
        let path = [];

        while (curr) {
          path.push(curr.val);
          this.renderCanvas(null, path);
          playKeyClick(500 + path.length * 50, 0.03);

          highlightCodeLine(1);
          if (curr.val === v) {
            playKeyClick(850, 0.08);
            this.renderCanvas(v, path);
            logMsg(`Found target <b>${v}</b> in <b>${path.length}</b> comparisons (O(log n) efficiency).`);
            setLock(false);
            return;
          }

          if (v < curr.val) {
            highlightCodeLine(2);
            logMsg(`${v} < ${curr.val}: Branching LEFT (halving search space)...`);
            curr = curr.left;
          } else {
            highlightCodeLine(3);
            logMsg(`${v} > ${curr.val}: Branching RIGHT (halving search space)...`);
            curr = curr.right;
          }
          await waitStep();
        }

        highlightCodeLine(4);
        this.renderCanvas(null, path);
        setLock(false);
        logMsg(`Target value ${v} does not exist in the BST.`);
      },

      async inOrder() {
        setLock(true);
        setCodeLines(DS_CONFIG.bst.codeLines.inorder);
        const sorted = [];
        const path = [];

        async function traverse(node) {
          if (!node) return;
          highlightCodeLine(2);
          await traverse(node.left);
          sorted.push(node.val);
          path.push(node.val);
          highlightCodeLine(3);
          BSTModule.renderCanvas(node.val, path);
          playKeyClick(500 + sorted.length * 30, 0.03);
          logMsg(`In-order traversal visited: [${sorted.join(', ')}]...`);
          await waitStep();
          highlightCodeLine(4);
          await traverse(node.right);
        }

        await traverse(bstRoot);
        setLock(false);
        logMsg(`In-order traversal complete: <b>[${sorted.join(', ')}]</b> (Notice it is sorted).`);
      },

      reset() {
        playKeyClick(700, 0.04);
        bstRoot = buildBST([50, 25, 75, 12, 38, 60, 92]);
        this.renderCanvas();
        logMsg("BST reset to default balanced tree.");
      }
    };

            ${htBuckets.map((bucket, i) => `

                      <span>${item.v}</span>
                    </div>
                    ${j < bucket.length - 1 ? '<span class="text-slate-400 font-bold text-xs">-></span>' : ''}
                  `).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        `;
      },

      inspect(k, v) {
        playKeyClick(600, 0.03);
        logMsg(`Selected key <b>"${k}"</b> with value <b>"${v}"</b>.`);
        const kInp = document.getElementById('ht-key-in');
        const vInp = document.getElementById('ht-val-in');
        if (kInp) kInp.value = k;
        if (vInp) vInp.value = v;
      },

      insert() {
        playKeyClick(550, 0.04);
        const kInp = document.getElementById('ht-key-in');
        const vInp = document.getElementById('ht-val-in');
        const k = kInp.value.trim();
        const v = vInp.value.trim();
        if (!k || !v) { logMsg("Please enter both key and value."); return; }

        const idx = getHash(k);
        const bucket = htBuckets[idx];
        const existing = bucket.find(e => e.k === k);

        if (existing) {
          existing.v = v;
          logMsg(`Updated key "${k}" to "${v}" in bucket [${idx}].`);
        } else {
          bucket.push({ k, v });
          logMsg(`Inserted "${k}": "${v}" into bucket [${idx}].`);
        }

        kInp.value = '';
        vInp.value = '';
        this.renderCanvas(idx, k);
      },

      async lookup() {
        const kInp = document.getElementById('ht-key-in');
        const k = kInp.value.trim();
        if (!k) { logMsg("Enter key to search."); return; }

        setCodeLines(DS_CONFIG.hashtable.codeLines.lookup);
        highlightCodeLine(0);
        const idx = getHash(k);
        const bucket = htBuckets[idx];
        const found = bucket.find(e => e.k === k);

        this.renderCanvas(idx, found ? k : null);
        highlightCodeLine(2);
        playKeyClick(found ? 850 : 400, 0.05);

        if (found) {
          highlightCodeLine(3);
          logMsg(`Found key <b>"${k}"</b> with value <b>"${found.v}"</b> in bucket [${idx}].`);
        } else {
          highlightCodeLine(4);
          logMsg(`Key "${k}" not found in bucket [${idx}].`);
        }
      },

      deleteKey() {
        playKeyClick(420, 0.04);
        const kInp = document.getElementById('ht-key-in');
        const k = kInp.value.trim();
        if (!k) { logMsg("Enter key to delete."); return; }

        const idx = getHash(k);
        const before = htBuckets[idx].length;
        htBuckets[idx] = htBuckets[idx].filter(e => e.k !== k);

        this.renderCanvas(idx);
        if (htBuckets[idx].length < before) logMsg(`Deleted key "${k}" from bucket [${idx}].`);
        else logMsg(`Key "${k}" was not found.`);
      },

      reset() {
        playKeyClick(700, 0.04);
        initHT();
        this.renderCanvas();
        logMsg("Hash table reset to default entries.");
      }
    };

    /* ══════════════════════════════════════════════════════════
       MODULE REGISTRY & SWITCHER
    ══════════════════════════════════════════════════════════ */
    const MODULES = {
      array: ArrayModule,
      linkedlist: LinkedListModule,
      stack: StackModule,
      queue: QueueModule,
      bst: BSTModule,
      hashtable: HashTableModule
    };

    function switchDS(ds) {
      if (isLocked) return;
      playKeyClick(700, 0.03);
      currentDS = ds;

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('bg-white', 'text-slate-900', 'shadow-sm');
        btn.classList.add('text-slate-600');
        if (btn.getAttribute('onclick').includes(ds)) {
          btn.classList.add('bg-white', 'text-slate-900', 'shadow-sm');
          btn.classList.remove('text-slate-600');
        }
      });

      renderApp();
      logMsg(`Loaded <b>${DS_CONFIG[ds].title}</b>. Choose an operation or preset above.`);
    }

    // Bootstrap first render
    renderApp();
  </script>
</body>
</html>
