<!DOCTYPE html>

  <style>

      transform: translateY(-6px);

  <script>
    /* ══════════════════════════════════════════════════════════
       AUDIO ENGINE (Minimalist subtle feedback)
    ══════════════════════════════════════════════════════════ */
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
    }

    function playKeyClick(freq = 520, duration = 0.035) {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + duration);

        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-icon').textContent = soundEnabled ? '🔊' : '🔇';
      document.getElementById('sound-text').textContent = soundEnabled ? 'Audio' : 'Muted';
      if (soundEnabled) playKeyClick(700, 0.04);
    }

    /* ══════════════════════════════════════════════════════════
       ARCHITECTURAL STRUCTURE DATA & SPECS
    ══════════════════════════════════════════════════════════ */
    const DS_CONFIG = {
      array: {
        title: "Contiguous Array",
        codeNum: "01",
        category: "Sequential Physical Memory",
        summary: "An array stores a static sequence of elements in contiguous physical memory addresses. Direct element retrieval via arithmetic address calculation requires a single CPU clock cycle O(1). Inserting or deleting in arbitrary positions requires shifting elements left or right in O(n) linear time.",
        complexities: [
          { name: "Access", time: "O(1)", type: "optimal" },
          { name: "Search", time: "O(n)", type: "linear" },
          { name: "Insert", time: "O(n)", type: "linear" },
          { name: "Delete", time: "O(n)", type: "linear" }
        ],
        presets: [

          { name: "Worst-Case Scan", data: [10, 20, 30, 40, 50, 60, 99] },

        ],
        specs: [
          { label: "Memory Topology", desc: "Monolithic contiguous RAM allocation" },
          { label: "Indexing Formula", desc: "Address = Base_Addr + (Index × Element_Size)" },

        ],
        codeLines: {
          search: [
            "# Linear Search Verification",
            "def linear_search(arr, target):",
            "    for i in range(len(arr)):",
            "        if arr[i] == target:",
            "            return i  # Target resolved at offset i",
            "    return -1  # Target not found in block"
          ],
          insert: [
            "# Contiguous Insertion",
            "arr.append(value)  # O(1) amortized reallocation",
            "capacity_size = len(arr)"
          ],
          delete: [
            "# Contiguous Element Removal & Shift",
            "target = arr[index]",
            "for j in range(index, len(arr) - 1):",
            "    arr[j] = arr[j + 1]  # O(n) element copy",
            "arr.pop()"
          ]
        }
      },

      linkedlist: {
        title: "Singly Linked List",
        codeNum: "02",
        category: "Pointer-Chained Dispersed Nodes",
        summary: "A linked list consists of dynamically allocated node structures interconnected via pointer references. Memory addresses need not be adjacent. Prepending or deleting elements at the HEAD requires only pointer modification in O(1) time without memory reorganization.",
        complexities: [
          { name: "Access", time: "O(n)", type: "linear" },
          { name: "Search", time: "O(n)", timeType: "linear" },
          { name: "Insert Head", time: "O(1)", type: "optimal" },
          { name: "Delete Head", time: "O(1)", type: "optimal" }
        ],
        presets: [
          { name: "Standard Chain (4)", data: [18, 42, 9, 65] },
          { name: "Single Root", data: [50] },
          { name: "Pipeline of 6", data: [10, 20, 30, 40, 50, 60] }
        ],
        specs: [
          { label: "Memory Topology", desc: "Non-contiguous heap-allocated node entities" },
          { label: "Pointer Overhead", desc: "8 bytes per node reference pointer (64-bit)" },
          { label: "Head Manipulation", desc: "Instantaneous O(1) reference reassignment" }
        ],
        codeLines: {
          search: [
            "curr = head",
            "while curr is not None:",
            "    if curr.val == target: return True",
            "    curr = curr.next  # Pointer hop",
            "return False"
          ],
          insert: [
            "new_node = Node(value)",
            "new_node.next = head",
            "head = new_node  # O(1) head link"
          ],
          delete: [
            "if not head: return None",
            "head = head.next  # Detach head node in O(1)",
            "return head"
          ]
        }
      },

      stack: {
        title: "Stack Architecture",
        codeNum: "03",
        category: "LIFO Register Column",
        summary: "Follows strict Last-In, First-Out (LIFO) architectural constraints. Pointers restrict insertion and removal strictly to the top of the column. Fundamental to processor call frames, bracket syntax verification, and execution history.",
        complexities: [
          { name: "Push", time: "O(1)", type: "optimal" },
          { name: "Pop", time: "O(1)", type: "optimal" },
          { name: "Peek", time: "O(1)", type: "optimal" },
          { name: "Search", time: "O(n)", type: "linear" }
        ],
        presets: [
          { name: "Balanced Column (4)", data: [14, 28, 55, 90] },
          { name: "Full Capacity (5)", data: [10, 20, 30, 40, 50] },
          { name: "Clear Column", data: [] }
        ],
        specs: [
          { label: "Access Port", desc: "Top-of-Stack pointer register exclusively" },
          { label: "Operation Invariant", desc: "Restricted LIFO push/pop boundary" },
          { label: "Primary Application", desc: "CPU Activation records and call stacks" }
        ],
        codeLines: {
          push: [
            "stack.append(value)  # Allocate at Top",
            "sp_register = len(stack) - 1"
          ],
          pop: [
            "if len(stack) == 0: raise StackUnderflow()",
            "return stack.pop()  # O(1) Top removal"

          peek: [

          ]
        }
      },

      queue: {
        title: "Queue Pipeline",
        codeNum: "04",
        category: "FIFO Conduit Architecture",
        summary: "Enforces First-In, First-Out (FIFO) pipeline processing. Data elements enter strictly at the REAR port and exit through the FRONT gate. Foundation of asynchronous message brokers, IO buffers, and breadth-first search traversals.",
        complexities: [
          { name: "Enqueue", time: "O(1)", type: "optimal" },
          { name: "Dequeue", time: "O(1)", type: "optimal" },
          { name: "Peek", time: "O(1)", type: "optimal" },
          { name: "Search", time: "O(n)", type: "linear" }
        ],
        presets: [
          { name: "Nominal Stream (4)", data: [15, 33, 72, 8] },
          { name: "Single Packet", data: [99] },
          { name: "Throughput (6)", data: [5, 10, 15, 20, 25, 30] }
        ],
        specs: [
          { label: "Processing Order", desc: "Strict temporal FIFO queuing" },
          { label: "Entry/Exit Interfaces", desc: "Dual pointer: Head (Front) and Tail (Rear)" },
          { label: "Buffer Utilization", desc: "Continuous stream scheduling" }
        ],
        codeLines: {
          enqueue: [
            "queue.append(value)  # Enqueue to REAR",
            "rear_pointer = len(queue) - 1"
          ],
          dequeue: [
            "if len(queue) == 0: raise QueueDepleted()",
            "return queue.pop(0)  # Dequeue from FRONT"
          ]
        }
      },

      bst: {
        title: "Binary Search Tree",
        codeNum: "05",
        category: "Logarithmic Partitioning Graph",
        summary: "Organizes elements hierarchically such that for any given node, all left subtree descendants hold strictly smaller values, and all right descendants hold strictly larger values. Each decision halves the remaining search perimeter in O(log n) time.",
        complexities: [
          { name: "Search", time: "O(log n)", type: "optimal" },
          { name: "Insert", time: "O(log n)", type: "optimal" },
          { name: "Delete", time: "O(log n)", type: "optimal" },
          { name: "Worst Case", time: "O(n)", type: "critical" }
        ],
        presets: [
          { name: "Balanced Tree (7)", data: [50, 25, 75, 12, 38, 60, 92] },

        ],

          { label: "Height Efficiency", desc: "h = ⌊log₂ n⌋ when fully balanced" },

        ],
        codeLines: {
          search: [
            "while curr is not None:",
            "    if target == curr.val: return curr",
            "    elif target < curr.val: curr = curr.left",
            "    else: curr = curr.right",
            "return None  # Node not present in tree"
          ],
          inorder: [
            "def in_order(node):",
            "    if not node: return",
            "    in_order(node.left)",
            "    visit(node.val)  # Emits sorted scalar",
            "    in_order(node.right)"
          ]
        }
      },

      hashtable: {
        title: "Hash Map / Bucket Array",
        codeNum: "06",
        category: "Constant-Time Key-Address Indexing",
        summary: "Maps arbitrary alphanumeric keys to memory bucket offsets via a deterministic mathematical hashing algorithm. Collisions are handled via isolated linked chaining within bucket segments.",
        complexities: [
          { name: "Lookup", time: "O(1) avg", type: "optimal" },
          { name: "Insert", time: "O(1) avg", type: "optimal" },
          { name: "Delete", time: "O(1) avg", type: "optimal" },
          { name: "Worst Case", time: "O(n)", type: "critical" }
        ],
        presets: [

    /* ══════════════════════════════════════════════════════════
       STATE REPOSITORIES
    ══════════════════════════════════════════════════════════ */
    let currentDS = 'array';
    let isLocked = false;
    let stepResolver = null;

    let arrData = [12, 45, 7, 23, 56, 8, 89];

    class LLNode { constructor(v) { this.val = v; this.next = null; } }
    function buildLL(arr) {
      let h = null;
      for (let i = arr.length - 1; i >= 0; i--) {
        let n = new LLNode(arr[i]); n.next = h; h = n;
      }
      return h;
    }
    let llHead = buildLL([18, 42, 9, 65]);

    let stackData = [14, 28, 55, 90];
    let queueData = [15, 33, 72, 8];

    class BSTNode { constructor(v) { this.val = v; this.left = null; this.right = null; } }
    function bstInsert(r, v) {
      if (!r) return new BSTNode(v);
      if (v < r.val) r.left = bstInsert(r.left, v);
      else if (v > r.val) r.right = bstInsert(r.right, v);
      return r;
    }
    function buildBST(arr) {
      let r = null;
      arr.forEach(v => r = bstInsert(r, v));
      return r;
    }
    let bstRoot = buildBST([50, 25, 75, 12, 38, 60, 92]);

    const HT_SIZE = 5;
    let htBuckets = Array.from({ length: HT_SIZE }, () => []);
    function getHash(k) {
      let s = 0;
      for (let c of k) s = (s + c.charCodeAt(0)) % HT_SIZE;
      return s;
    }
    function initHT(data = null) {
      htBuckets = Array.from({ length: HT_SIZE }, () => []);
      const sample = data || [["user", "admin"], ["region", "us-east"], ["tenant", "csquare"], ["mode", "cluster"], ["scale", "4x"]];
      sample.forEach(([k, v]) => htBuckets[getHash(k)].push({ k, v }));
    }
    initHT();

    /* ══════════════════════════════════════════════════════════
       STEPPER ENGINE
    ══════════════════════════════════════════════════════════ */
    function getDelay() {
      const el = document.getElementById('anim-speed');
      return el ? parseInt(el.value) : 450;
    }

    async function waitStep() {
      const btn = document.getElementById('btn-step-fwd');
      if (btn) btn.disabled = false;

      const delayMs = getDelay();
      return new Promise(resolve => {
        let timer = null;
        stepResolver = () => {
          clearTimeout(timer);
          if (btn) btn.disabled = true;
          stepResolver = null;
          resolve();
        };
        timer = setTimeout(() => {
          if (stepResolver) stepResolver();
        }, delayMs);
      });
    }

    function stepForward() {
      if (stepResolver) {
        playKeyClick(700, 0.03);
        stepResolver();
      }
    }

    function logMsg(msg) {
      const el = document.getElementById('log-msg');
      if (el) el.innerHTML = msg;
    }

    function highlightCodeLine(lineIdx) {
      document.querySelectorAll('.code-row').forEach((el, i) => {
        if (i === lineIdx) el.classList.add('active-row');
        else el.classList.remove('active-row');
      });
    }

    function setLock(locked) {
      isLocked = locked;
      document.querySelectorAll('input, button').forEach(b => {
        if (!b.id.includes('anim-speed') && b.id !== 'btn-step-fwd' && !b.classList.contains('nav-tab')) {
          b.disabled = locked;
        }
      });
    }

    /* ══════════════════════════════════════════════════════════
       SVG ISOMETRIC GENERATOR HELPER
    ══════════════════════════════════════════════════════════ */
    // Generates high-end isometric cube path with 3 distinct shading faces
    function generateIsometricCubeSvg(x, y, size, val, isHighlighted = false, isFound = false) {
      const w = size;
      const h = size * 0.58;
      const depth = size * 0.7;

      // Color scheme (Emerald / Green or Magenta)
      let topFill = '#ffffff';
      let leftFill = '#f1f5f9';
      let rightFill = '#e2e8f0';
      let stroke = '#cbd5e1';
      let textColor = '#090a0f';

      if (isFound) {
        topFill = '#34d399';
        leftFill = '#10b981';
        rightFill = '#059669';
        stroke = '#047857';
        textColor = '#ffffff';
      } else if (isHighlighted) {
        topFill = '#38bdf8';
        leftFill = '#0ea5e9';
        rightFill = '#0284c7';
        stroke = '#0369a1';
        textColor = '#ffffff';
      }

      return `
        <g class="iso-cube ${isHighlighted ? 'active-scan' : ''} ${isFound ? 'found-target' : ''}">
          <!-- Top Face -->
          <polygon points="${x},${y - h/2} ${x + w/2},${y} ${x},${y + h/2} ${x - w/2},${y}" fill="${topFill}" stroke="${stroke}" stroke-width="1.5" stroke-linejoin="round" />
          
          <!-- Left Face -->
          <polygon points="${x - w/2},${y} ${x},${y + h/2} ${x},${y + h/2 + depth} ${x - w/2},${y + depth}" fill="${leftFill}" stroke="${stroke}" stroke-width="1.5" stroke-linejoin="round" />
          
          <!-- Right Face -->
          <polygon points="${x},${y + h/2} ${x + w/2},${y} ${x + w/2},${y + depth} ${x},${y + h/2 + depth}" fill="${rightFill}" stroke="${stroke}" stroke-width="1.5" stroke-linejoin="round" />
          
          <!-- Centered Scalar Value on Top Face -->
          <text x="${x}" y="${y + 4}" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="${textColor}">
            ${val}
          </text>
        </g>
      `;
    }

    /* ══════════════════════════════════════════════════════════
       MAIN RENDER ENGINE
    ══════════════════════════════════════════════════════════ */
    function renderApp() {

      // 4. Bottom Blueprint & Code
      const defaultLines = cfg.codeLines.search || cfg.codeLines.insert || cfg.codeLines.push || cfg.codeLines.lookup;
      document.getElementById('ds-blueprint-section').innerHTML = `
        <!-- Left: Technical Specification Checklist -->
        <div class="lg:col-span-6 bg-white border border-slate-200 p-8 shadow-sm flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
              <span class="text-xs font-mono font-semibold uppercase text-slate-400">Architectural Specifications</span>
              <span class="text-xs font-mono text-emerald-600 font-semibold">VERIFIED</span>
            </div>

            <div class="space-y-4">
              ${cfg.specs.map(s => `
                <div class="border-b border-slate-100 pb-3">
                  <span class="text-xs font-semibold text-black uppercase tracking-wider block">${s.label}</span>
                  <span class="text-xs text-slate-600 font-mono mt-1 block">${s.desc}</span>

              `).join('')}
            </div>
          </div>

          <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400 font-mono">
            <span>SPECIFICATION_REV: 2026.02</span>
            <span>MEMORY_SAFE: TRUE</span>
          </div>
        </div>

        <!-- Right: Code Implementation -->
        <div class="lg:col-span-6 bg-[#0c0e14] border border-slate-800 p-8 text-white flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
              <span class="text-xs font-mono font-semibold uppercase text-slate-400">Verified Algorithm Implementation</span>
              <span class="text-[0.7rem] font-mono px-2 py-0.5 bg-slate-800 text-slate-300 rounded">Python 3.12</span>
            </div>

            <div id="code-box" class="font-mono text-xs text-slate-300 overflow-x-auto min-h-[170px] flex flex-col justify-center">
              ${defaultLines.map(l => `<span class="code-row">${l}</span>`).join('')}
            </div>
          </div>

          <div class="mt-6 pt-4 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-500 font-mono">
            <span>SYNTAX: PYTHON_AST</span>
            <span>STATUS: ACTIVE_TRACING</span>
          </div>
        </div>
      `;
    }

    function setCodeLines(lines) {
      const box = document.getElementById('code-box');
      if (box) {
        box.innerHTML = lines.map(l => `<span class="code-row">${l}</span>`).join('');
      }
    }

    function loadPreset(idx) {
      playKeyClick(700, 0.04);
      const preset = DS_CONFIG[currentDS].presets[idx];
      if (currentDS === 'array') arrData = [...preset.data];
      else if (currentDS === 'linkedlist') llHead = buildLL(preset.data);
      else if (currentDS === 'stack') stackData = [...preset.data];
      else if (currentDS === 'queue') queueData = [...preset.data];
      else if (currentDS === 'bst') bstRoot = buildBST(preset.data);
      else if (currentDS === 'hashtable') initHT(preset.data);

      MODULES[currentDS].renderCanvas();
      logMsg(`Scenario loaded: <b>${preset.name}</b>`);
    }

    /* ══════════════════════════════════════════════════════════
       1. ARRAY MODULE (Isometric Memory Cubes)
    ══════════════════════════════════════════════════════════ */
    const ArrayModule = {
      renderControls() {
        const presets = DS_CONFIG.array.presets;
        document.getElementById('ds-command-bar').innerHTML = `
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <!-- Command Inputs -->
            <div class="flex flex-wrap items-center gap-2.5">
              <input id="arr-val-in" type="number" placeholder="Value" class="swiss-input w-24" onkeydown="if(event.key==='Enter') ArrayModule.insert()" />
              <button class="btn-swiss-dark" onclick="ArrayModule.insert()">
                <span>+ Insert</span>
              </button>

              <div class="h-5 w-px bg-slate-200 hidden sm:block"></div>

              <input id="arr-idx-in" type="number" placeholder="[Offset]" class="swiss-input w-24" onkeydown="if(event.key==='Enter') ArrayModule.deleteIdx()" />
              <button class="btn-swiss-danger" onclick="ArrayModule.deleteIdx()">
                <span>Delete [i]</span>
              </button>

              <div class="h-5 w-px bg-slate-200 hidden sm:block"></div>

              <button class="btn-swiss-outline" onclick="ArrayModule.search()">
                <span>Search</span>
              </button>

              <button class="btn-swiss-outline" onclick="ArrayModule.reset()">
                <span>Reset</span>
              </button>
            </div>

            <!-- Presets -->
            <div class="flex items-center gap-2 flex-shrink-0">
              <span class="text-xs font-mono text-slate-400">VECTORS:</span>
              ${presets.map((p, i) => `
                <button onclick="loadPreset(${i})" class="px-2.5 py-1 text-xs font-mono border border-slate-200 hover:bg-slate-50 text-slate-700 transition-all rounded-sm">
                  ${p.name}
                </button>
              `).join('')}
            </div>
          </div>
        `;
      },

      renderCanvas(highlightIdx = -1, styleType = 'active-scan') {
        const stage = document.getElementById('ds-stage-container');
        if (!stage) return;
        if (arrData.length === 0) {
          stage.innerHTML = `<div class="text-xs font-mono text-slate-500">Vector buffer is unallocated.</div>`;
          return;
        }

        const W = 460;
        const H = 220;
        const startX = 50;
        const spacing = Math.min(54, (W - 100) / arrData.length);

        let cubesSvg = '';
        arrData.forEach((val, i) => {
          const cx = startX + i * spacing;
          const cy = 110;
          const isScan = i === highlightIdx;
          const isFound = styleType === 'found-target' && isScan;
          cubesSvg += generateIsometricCubeSvg(cx, cy, 48, val, isScan, isFound);

          // Blueprint memory address tag below
          cubesSvg += `
            <text x="${cx}" y="${cy + 60}" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#64748b">
              [${i}]
            </text>
            <text x="${cx}" y="${cy + 74}" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#475569">
              0x${(1000 + i * 4).toString(16).toUpperCase()}
            </text>
          `;
        });

        stage.innerHTML = `
          <div class="w-full flex flex-col items-center">
            <div class="flex items-center justify-between w-full text-[0.7rem] font-mono text-slate-500 mb-2">
              <span>PHYSICAL_MEMORY_BLOCK: 0x1000</span>
              <span class="text-emerald-500">LENGTH = ${arrData.length} WORDS</span>
            </div>
            <svg viewBox="0 0 ${W} ${H}" class="w-full max-w-lg h-auto">
              ${cubesSvg}
            </svg>
          </div>
        `;
      },

      insert() {
        playKeyClick(550, 0.04);
        const inp = document.getElementById('arr-val-in');
        const v = parseInt(inp.value);
        if (isNaN(v)) { logMsg("Command rejected: Numeric value required."); return; }
        if (arrData.length >= 8) { logMsg("Buffer limit reached (max 8 words in viewport)."); return; }
        arrData.push(v);
        inp.value = '';
        setCodeLines(DS_CONFIG.array.codeLines.insert);
        highlightCodeLine(1);
        this.renderCanvas(arrData.length - 1, 'active-scan');
        logMsg(`Allocation success: appended <b>${v}</b> at offset [${arrData.length - 1}] in O(1).`);
      },

      async deleteIdx() {
        playKeyClick(400, 0.05);
        const inp = document.getElementById('arr-idx-in');
        const idx = parseInt(inp.value);
        if (isNaN(idx) || idx < 0 || idx >= arrData.length) {
          logMsg(`Invalid offset. Valid boundary: 0..${arrData.length - 1}.`);
          return;
        }

        setLock(true);
        setCodeLines(DS_CONFIG.array.codeLines.delete);
        highlightCodeLine(1);
        this.renderCanvas(idx, 'active-scan');
        logMsg(`Deallocating offset [${idx}]... executing memory shift left.`);
        await sleep(320);

        highlightCodeLine(3);
        const removed = arrData.splice(idx, 1)[0];
        inp.value = '';
        this.renderCanvas();
        highlightCodeLine(4);
        setLock(false);
        logMsg(`Deallocated word <b>${removed}</b>. Trailing elements shifted left in O(n) time.`);
      },

      async search() {
        const inp = document.getElementById('arr-val-in');
        const v = parseInt(inp.value);
        if (isNaN(v)) { logMsg("Command rejected: Specify target value in Value input."); return; }

        setLock(true);
        setCodeLines(DS_CONFIG.array.codeLines.search);
        logMsg(`Scanning contiguous block for target value: <b>${v}</b>...`);

        for (let i = 0; i < arrData.length; i++) {
          highlightCodeLine(2);
          this.renderCanvas(i, 'active-scan');
          playKeyClick(500 + i * 40, 0.03);
          logMsg(`Evaluating offset [${i}] -> compare memory word ${arrData[i]} === ${v}...`);
          await waitStep();

          highlightCodeLine(3);
          if (arrData[i] === v) {
            highlightCodeLine(4);
            playKeyClick(850, 0.08);
            this.renderCanvas(i, 'found-target');
            logMsg(`Target verified: <b>${v}</b> resolved at offset <b>[${i}]</b> in ${i + 1} cycles.`);
            setLock(false);
            return;
          }
        }

        highlightCodeLine(5);
        this.renderCanvas();
        setLock(false);
        logMsg(`Target <b>${v}</b> not located within the allocated memory block.`);
      },

      reset() {
        playKeyClick(700, 0.04);
        arrData = [12, 45, 7, 23, 56, 8, 89];
        this.renderCanvas();
        logMsg("Vector buffer reset to default architecture.");
      }
    };

    /* ══════════════════════════════════════════════════════════
       2. LINKED LIST MODULE (Orthogonal Blueprint Pipeline)
    ══════════════════════════════════════════════════════════ */
    const LinkedListModule = {
      renderControls() {
        const presets = DS_CONFIG.linkedlist.presets;
        document.getElementById('ds-command-bar').innerHTML = `
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex flex-wrap items-center gap-2.5">
              <input id="ll-val-in" type="number" placeholder="Value" class="swiss-input w-24" onkeydown="if(event.key==='Enter') LinkedListModule.insertHead()" />
              <button class="btn-swiss-dark" onclick="LinkedListModule.insertHead()">
                <span>+ Insert Head (O(1))</span>
              </button>
              <button class="btn-swiss-outline" onclick="LinkedListModule.insertTail()">
                <span>+ Insert Tail</span>
              </button>
              <button class="btn-swiss-danger" onclick="LinkedListModule.deleteHead()">
                <span>Delete Head</span>
              </button>
              <button class="btn-swiss-outline" onclick="LinkedListModule.search()">
                <span>Search</span>
              </button>
              <button class="btn-swiss-outline" onclick="LinkedListModule.reset()">
                <span>Reset</span>
              </button>
            </div>

            <div class="flex items-center gap-2 flex-shrink-0">
              <span class="text-xs font-mono text-slate-400">VECTORS:</span>
              ${presets.map((p, i) => `
                <button onclick="loadPreset(${i})" class="px-2.5 py-1 text-xs font-mono border border-slate-200 hover:bg-slate-50 text-slate-700 transition-all rounded-sm">
                  ${p.name}
                </button>
              `).join('')}
            </div>
          </div>
        `;
      },

      renderCanvas(highlightVal = null) {
        const stage = document.getElementById('ds-stage-container');
        if (!stage) return;
        let nodes = [];
        let curr = llHead;
        while (curr) { nodes.push(curr.val); curr = curr.next; }

        if (nodes.length === 0) {
          stage.innerHTML = `<div class="text-xs font-mono text-slate-500">HEAD reference is null.</div>`;
          return;
        }

        const W = 460;
        const H = 200;
        const startX = 40;
        const nodeWidth = 60;
        const spacing = Math.min(85, (W - 80) / nodes.length);

        let svgContent = '';
        nodes.forEach((val, i) => {
          const nx = startX + i * spacing;
          const ny = 75;
          const isHigh = val === highlightVal;

          // Wire connectors
          if (i < nodes.length - 1) {
            svgContent += `
              <line x1="${nx + nodeWidth}" y1="${ny + 18}" x2="${nx + spacing}" y2="${ny + 18}" stroke="#334155" stroke-width="2" />
              <polygon points="${nx + spacing},${ny + 18} ${nx + spacing - 6},${ny + 14} ${nx + spacing - 6},${ny + 22}" fill="#334155" />
            `;
          }

          // Node Box
          svgContent += `
            <g class="cursor-pointer">
              <!-- Value Section -->
              <rect x="${nx}" y="${ny}" width="${nodeWidth * 0.65}" height="36" fill="${isHigh ? '#10b981' : '#1e293b'}" stroke="${isHigh ? '#34d399' : '#334155'}" stroke-width="1.5" />
              <text x="${nx + nodeWidth * 0.325}" y="${ny + 23}" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#ffffff">
                ${val}
              </text>
              
              <!-- Pointer Section -->
              <rect x="${nx + nodeWidth * 0.65}" y="${ny}" width="${nodeWidth * 0.35}" height="36" fill="#0f172a" stroke="${isHigh ? '#34d399' : '#334155'}" stroke-width="1.5" />
              <circle cx="${nx + nodeWidth * 0.825}" cy="${ny + 18}" r="3" fill="#38bdf8" />
              
              <!-- Address label -->
              <text x="${nx + nodeWidth * 0.5}" y="${ny + 54}" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">
                0x${(2048 + i * 16).toString(16).toUpperCase()}
              </text>
            </g>
          `;
        });

        stage.innerHTML = `
          <div class="w-full flex flex-col items-center">
            <div class="flex items-center justify-between w-full text-[0.7rem] font-mono text-slate-500 mb-2">
              <span>HEAD -> 0x${(2048).toString(16).toUpperCase()}</span>
              <span class="text-cyan-400">CHAIN NODES: ${nodes.length}</span>
            </div>
            <svg viewBox="0 0 ${W} ${H}" class="w-full max-w-lg h-auto">
              ${svgContent}
            </svg>
          </div>
        `;
      },

      insertHead() {
        playKeyClick(550, 0.04);
        const inp = document.getElementById('ll-val-in');
        const v = parseInt(inp.value);
        if (isNaN(v)) { logMsg("Command rejected: Numeric value required."); return; }
        const n = new LLNode(v);
        n.next = llHead;
        llHead = n;
        inp.value = '';
        setCodeLines(DS_CONFIG.linkedlist.codeLines.insert);
        highlightCodeLine(2);
        this.renderCanvas(v);
        logMsg(`Pointer re-assigned: node <b>${v}</b> attached at HEAD in O(1) time.`);
      },

      insertTail() {
        playKeyClick(550, 0.04);
        const inp = document.getElementById('ll-val-in');
        const v = parseInt(inp.value);
        if (isNaN(v)) { logMsg("Command rejected: Numeric value required."); return; }
        const n = new LLNode(v);
        if (!llHead) llHead = n;
        else {
          let c = llHead;
          while (c.next) c = c.next;
          c.next = n;
        }
        inp.value = '';
        this.renderCanvas(v);
        logMsg(`Traversed to NULL terminator: appended node <b>${v}</b> at TAIL.`);
      },

      deleteHead() {
        playKeyClick(420, 0.04);
        if (!llHead) { logMsg("Operation failed: List is empty."); return; }
        setCodeLines(DS_CONFIG.linkedlist.codeLines.delete);
        highlightCodeLine(1);
        const val = llHead.val;
        llHead = llHead.next;
        this.renderCanvas();
        logMsg(`Unlinked HEAD node <b>${val}</b> in O(1) time.`);
      },

      async search() {
        const inp = document.getElementById('ll-val-in');
        const v = parseInt(inp.value);
        if (isNaN(v)) { logMsg("Command rejected: Enter search target."); return; }

        setLock(true);
        setCodeLines(DS_CONFIG.linkedlist.codeLines.search);
        let curr = llHead;
        let count = 0;

        while (curr) {
          highlightCodeLine(1);
          this.renderCanvas(curr.val);
          playKeyClick(520 + count * 40, 0.03);
          logMsg(`Traversing node reference ${count}: testing payload <b>${curr.val}</b> === ${v}...`);
          await waitStep();

          highlightCodeLine(2);
          if (curr.val === v) {
            playKeyClick(850, 0.08);
            logMsg(`Target located: node <b>${v}</b> matched after ${count + 1} pointer transitions.`);
            setLock(false);
            return;
          }
          highlightCodeLine(3);
          curr = curr.next;
          count++;
        }

        highlightCodeLine(4);
        this.renderCanvas(null);
        setLock(false);
        logMsg(`Target <b>${v}</b> not encountered in node chain.`);
      },

      reset() {
        playKeyClick(700, 0.04);
        llHead = buildLL([18, 42, 9, 65]);
        this.renderCanvas();
        logMsg("Linked list pipeline reset.");
      }
    };

    /* ══════════════════════════════════════════════════════════
       3. STACK MODULE (Isometric Elevator Column)
    ══════════════════════════════════════════════════════════ */
    const StackModule = {
      renderControls() {
        const presets = DS_CONFIG.stack.presets;
        document.getElementById('ds-command-bar').innerHTML = `
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex flex-wrap items-center gap-2.5">
              <input id="st-val-in" type="number" placeholder="Value" class="swiss-input w-24" onkeydown="if(event.key==='Enter') StackModule.push()" />
              <button class="btn-swiss-dark" onclick="StackModule.push()">
                <span>+ Push (Top)</span>
              </button>
              <button class="btn-swiss-danger" onclick="StackModule.pop()">
                <span>- Pop (Top)</span>
              </button>
              <button class="btn-swiss-outline" onclick="StackModule.peek()">
                <span>Peek</span>
              </button>
              <button class="btn-swiss-outline" onclick="StackModule.reset()">
                <span>Reset</span>
              </button>
            </div>

            <div class="flex items-center gap-2 flex-shrink-0">
              <span class="text-xs font-mono text-slate-400">VECTORS:</span>
              ${presets.map((p, i) => `
                <button onclick="loadPreset(${i})" class="px-2.5 py-1 text-xs font-mono border border-slate-200 hover:bg-slate-50 text-slate-700 transition-all rounded-sm">
                  ${p.name}
                </button>
              `).join('')}
            </div>
          </div>
        `;
      },

      renderCanvas() {
        const stage = document.getElementById('ds-stage-container');
        if (!stage) return;
        const topIdx = stackData.length - 1;

        stage.innerHTML = `
          <div class="w-full flex flex-col items-center py-2">
            <div class="flex items-center justify-between w-full max-w-xs text-[0.7rem] font-mono text-slate-500 mb-2">
              <span>STACK_POINTER: [SP = ${stackData.length}]</span>
              <span class="text-emerald-400">LIFO INVARIANT</span>
            </div>

            <div class="w-64 min-h-[220px] border-x border-b border-slate-800 bg-[#0f1118] flex flex-col-reverse p-3 gap-2">
              ${stackData.map((v, i) => `
                <div class="w-full p-2.5 border flex items-center justify-between font-mono text-xs ${i === topIdx ? 'bg-emerald-950/60 border-emerald-500 text-emerald-300' : 'bg-slate-900 border-slate-800 text-slate-300'}">
                  <span class="font-bold text-sm text-white">${v}</span>
                  <span class="text-[0.65rem] text-slate-500">${i === topIdx ? '← SP (TOP)' : `OFFSET [${i}]`}</span>
                </div>
              `).join('')}
              ${stackData.length === 0 ? '<div class="text-center font-mono text-xs text-slate-600 my-auto">Stack column is empty</div>' : ''}
            </div>
            
            <div class="w-64 border-t-2 border-slate-700 text-center pt-2 mt-1">
              <span class="text-[0.65rem] font-mono text-slate-600 uppercase">BASE_REGISTER (RESTRICTED)</span>
            </div>
          </div>
        `;
      },

      push() {
        playKeyClick(600, 0.04);
        const inp = document.getElementById('st-val-in');
        const v = parseInt(inp.value);
        if (isNaN(v)) { logMsg("Command rejected: Numeric value required."); return; }
        if (stackData.length >= 6) { logMsg("Hardware stack limit reached for visual register."); return; }
        stackData.push(v);
        inp.value = '';
        setCodeLines(DS_CONFIG.stack.codeLines.push);
        highlightCodeLine(0);
        this.renderCanvas();
        logMsg(`Pushed <b>${v}</b> to TOP register in O(1) time. Depth = ${stackData.length}.`);
      },

      pop() {
        playKeyClick(420, 0.05);
        if (stackData.length === 0) { logMsg("Fault: Stack Underflow."); return; }
        setCodeLines(DS_CONFIG.stack.codeLines.pop);
        highlightCodeLine(1);
        const removed = stackData.pop();
        this.renderCanvas();
        logMsg(`Popped <b>${removed}</b> from TOP register in O(1) time.`);
      },

      peek() {
        playKeyClick(700, 0.03);
        if (stackData.length === 0) { logMsg("Stack column is empty."); return; }
        setCodeLines(DS_CONFIG.stack.codeLines.peek);
        highlightCodeLine(1);
        logMsg(`Peek: TOP register holds <b>${stackData[stackData.length - 1]}</b>.`);
      },

      reset() {
        playKeyClick(700, 0.04);
        stackData = [14, 28, 55, 90];
        this.renderCanvas();
        logMsg("Stack register column reset.");
      }
    };

    /* ══════════════════════════════════════════════════════════
       4. QUEUE MODULE (Pipeline Conveyor)
    ══════════════════════════════════════════════════════════ */
    const QueueModule = {
      renderControls() {
        const presets = DS_CONFIG.queue.presets;
        document.getElementById('ds-command-bar').innerHTML = `
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex flex-wrap items-center gap-2.5">
              <input id="qu-val-in" type="number" placeholder="Value" class="swiss-input w-24" onkeydown="if(event.key==='Enter') QueueModule.enqueue()" />
              <button class="btn-swiss-dark" onclick="QueueModule.enqueue()">
                <span>+ Enqueue (Rear)</span>
              </button>
              <button class="btn-swiss-danger" onclick="QueueModule.dequeue()">
                <span>- Dequeue (Front)</span>
              </button>
              <button class="btn-swiss-outline" onclick="QueueModule.peek()">
                <span>Peek</span>
              </button>
              <button class="btn-swiss-outline" onclick="QueueModule.reset()">
                <span>Reset</span>
              </button>
            </div>

            <div class="flex items-center gap-2 flex-shrink-0">
              <span class="text-xs font-mono text-slate-400">VECTORS:</span>
              ${presets.map((p, i) => `
                <button onclick="loadPreset(${i})" class="px-2.5 py-1 text-xs font-mono border border-slate-200 hover:bg-slate-50 text-slate-700 transition-all rounded-sm">
                  ${p.name}
                </button>
              `).join('')}
            </div>
          </div>
        `;
      },

      renderCanvas() {
        const stage = document.getElementById('ds-stage-container');
        if (!stage) return;
        stage.innerHTML = `
          <div class="w-full flex flex-col items-center">
            <div class="flex justify-between w-full max-w-md text-[0.7rem] font-mono text-slate-500 mb-2">
              <span class="text-emerald-400 font-semibold">FRONT_PORT (OUT) ⬅️</span>
              <span class="text-cyan-400 font-semibold">⬅️ REAR_PORT (IN)</span>
            </div>

            <div class="flex items-center gap-2 p-4 border border-slate-800 bg-[#0f1118] w-full max-w-md overflow-x-auto justify-center min-h-[110px]">
              ${queueData.map((v, i) => `
                <div class="flex flex-col items-center gap-1.5 flex-shrink-0">
                  <div class="w-12 h-12 border flex items-center justify-center font-mono font-bold text-sm ${i === 0 ? 'bg-emerald-950/60 border-emerald-500 text-emerald-300' : i === queueData.length - 1 ? 'bg-cyan-950/60 border-cyan-500 text-cyan-300' : 'bg-slate-900 border-slate-800 text-slate-300'}">
                    ${v}
                  </div>
                  <span class="text-[0.65rem] font-mono text-slate-500">${i === 0 ? 'FRONT' : i === queueData.length - 1 ? 'REAR' : `p[${i}]`}</span>
                </div>
              `).join('')}
              ${queueData.length === 0 ? '<div class="text-xs font-mono text-slate-600">Pipeline empty</div>' : ''}
            </div>
          </div>
        `;
      },

      enqueue() {
        playKeyClick(600, 0.04);
        const inp = document.getElementById('qu-val-in');
        const v = parseInt(inp.value);
        if (isNaN(v)) { logMsg("Command rejected: Numeric value required."); return; }
        if (queueData.length >= 7) { logMsg("Queue pipeline buffer full."); return; }
        queueData.push(v);
        inp.value = '';
        setCodeLines(DS_CONFIG.queue.codeLines.enqueue);
        highlightCodeLine(0);
        this.renderCanvas();
        logMsg(`Enqueued <b>${v}</b> to REAR gate in O(1) time.`);
      },

      dequeue() {
        playKeyClick(420, 0.04);
        if (queueData.length === 0) { logMsg("Pipeline depleted."); return; }
        setCodeLines(DS_CONFIG.queue.codeLines.dequeue);
        highlightCodeLine(1);
        const removed = queueData.shift();
        this.renderCanvas();
        logMsg(`Dequeued <b>${removed}</b> from FRONT port in FIFO sequence.`);
      },

      peek() {
        playKeyClick(700, 0.03);
        if (queueData.length === 0) { logMsg("Queue is empty."); return; }
        logMsg(`Peek: Next packet to dequeue is <b>${queueData[0]}</b>.`);
      },

      reset() {
        playKeyClick(700, 0.04);
        queueData = [15, 33, 72, 8];
        this.renderCanvas();
        logMsg("Queue pipeline reset.");
      }
    };

    /* ══════════════════════════════════════════════════════════
       5. BST MODULE (Orthogonal Wire Graph)
    ══════════════════════════════════════════════════════════ */
    const BSTModule = {
      renderControls() {
        const presets = DS_CONFIG.bst.presets;
        document.getElementById('ds-command-bar').innerHTML = `
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex flex-wrap items-center gap-2.5">
              <input id="bst-val-in" type="number" placeholder="Value" class="swiss-input w-24" onkeydown="if(event.key==='Enter') BSTModule.insert()" />
              <button class="btn-swiss-dark" onclick="BSTModule.insert()">
                <span>+ Insert</span>
              </button>
              <button class="btn-swiss-outline" onclick="BSTModule.search()">
                <span>Search</span>
              </button>
              <button class="btn-swiss-outline" onclick="BSTModule.inOrder()">
                <span>In-Order</span>
              </button>
              <button class="btn-swiss-outline" onclick="BSTModule.reset()">
                <span>Reset</span>
              </button>
            </div>

            <div class="flex items-center gap-2 flex-shrink-0">
              <span class="text-xs font-mono text-slate-400">VECTORS:</span>
              ${presets.map((p, i) => `
                <button onclick="loadPreset(${i})" class="px-2.5 py-1 text-xs font-mono border border-slate-200 hover:bg-slate-50 text-slate-700 transition-all rounded-sm">
                  ${p.name}
                </button>
              `).join('')}
            </div>
          </div>
        `;
      },

      renderCanvas(targetVal = null, pathVals = []) {
        const stage = document.getElementById('ds-stage-container');
        if (!stage) return;
        const W = 460;
        const H = 220;

        function calc(n, depth, l, r, map) {
          if (!n) return;
          const x = (l + r) / 2;
          const y = depth * 55 + 35;
          map[n.val] = { x, y, n };
          calc(n.left, depth + 1, l, x, map);
          calc(n.right, depth + 1, x, r, map);
        }

        const posMap = {};
        calc(bstRoot, 0, 0, W, posMap);

        let linesSvg = '';
        let nodesSvg = '';

        function drawLines(n) {
          if (!n) return;
          const cur = posMap[n.val];
          if (n.left) {
            const lc = posMap[n.left.val];
            linesSvg += `<line x1="${cur.x}" y1="${cur.y}" x2="${lc.x}" y2="${lc.y}" stroke="#334155" stroke-width="1.5" />`;
            drawLines(n.left);
          }
          if (n.right) {
            const rc = posMap[n.right.val];
            linesSvg += `<line x1="${cur.x}" y1="${cur.y}" x2="${rc.x}" y2="${rc.y}" stroke="#334155" stroke-width="1.5" />`;
            drawLines(n.right);
          }
        }
        drawLines(bstRoot);

        Object.values(posMap).forEach(({ x, y, n }) => {
          const isTarget = n.val === targetVal;
          const inPath = pathVals.includes(n.val);

          let fill = '#1e293b';
          let stroke = '#475569';
          let textColor = '#ffffff';

          if (isTarget) {
            fill = '#10b981';
            stroke = '#34d399';
            textColor = '#022c22';
          } else if (inPath) {
            fill = '#0284c7';
            stroke = '#38bdf8';
            textColor = '#ffffff';
          }

          nodesSvg += `
            <g transform="translate(${x},${y})" onclick="BSTModule.inspect(${n.val})" class="cursor-pointer">
              <circle r="18" fill="${fill}" stroke="${stroke}" stroke-width="1.5" />
              <text text-anchor="middle" dy="4.5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="${textColor}">
                ${n.val}
              </text>
            </g>
          `;
        });

        stage.innerHTML = `
          <div class="w-full flex flex-col items-center">
            <div class="flex items-center justify-between w-full text-[0.7rem] font-mono text-slate-500 mb-2">
              <span>ROOT_NODE: [${bstRoot ? bstRoot.val : 'NULL'}]</span>
              <span class="text-emerald-400">PARTITION_INVARIANT</span>
            </div>
            <svg viewBox="0 0 ${W} ${H}" class="w-full max-w-lg h-auto">
              ${linesSvg}
              ${nodesSvg}
            </svg>
          </div>
        `;
      },

      inspect(val) {
        playKeyClick(600, 0.03);
        logMsg(`Inspected node [${val}]: LeftSubtree < ${val}, RightSubtree > ${val}.`);
        const inp = document.getElementById('bst-val-in');
        if (inp) inp.value = val;
      },

      insert() {
        playKeyClick(550, 0.04);
        const inp = document.getElementById('bst-val-in');
        const v = parseInt(inp.value);
        if (isNaN(v)) { logMsg("Command rejected: Numeric value required."); return; }
        bstRoot = bstInsert(bstRoot, v);
        inp.value = '';
        this.renderCanvas(v);
        logMsg(`Partitioned node [${v}] into tree in O(log n) time.`);
      },

      async search() {
        const inp = document.getElementById('bst-val-in');
        const v = parseInt(inp.value);
        if (isNaN(v)) { logMsg("Enter search target value."); return; }

        setLock(true);
        setCodeLines(DS_CONFIG.bst.codeLines.search);
        let curr = bstRoot;
        let path = [];

        while (curr) {
          path.push(curr.val);
          this.renderCanvas(null, path);
          playKeyClick(500 + path.length * 50, 0.03);

          highlightCodeLine(1);
          if (curr.val === v) {
            playKeyClick(850, 0.08);
            this.renderCanvas(v, path);
            logMsg(`Target located: <b>${v}</b> resolved in ${path.length} logarithmic branch evaluations.`);
            setLock(false);
            return;
          }

          if (v < curr.val) {
            highlightCodeLine(2);
            logMsg(`${v} < ${curr.val}: Branching LEFT (halving boundary)...`);
            curr = curr.left;
          } else {
            highlightCodeLine(3);
            logMsg(`${v} > ${curr.val}: Branching RIGHT (halving boundary)...`);
            curr = curr.right;
          }
          await waitStep();
        }

        highlightCodeLine(4);
        this.renderCanvas(null, path);
        setLock(false);
        logMsg(`Target ${v} is not present in binary search partition.`);
      },

      async inOrder() {
        setLock(true);
        setCodeLines(DS_CONFIG.bst.codeLines.inorder);
        const sorted = [];
        const path = [];

        async function traverse(node) {
          if (!node) return;
          highlightCodeLine(2);
          await traverse(node.left);
          sorted.push(node.val);
          path.push(node.val);
          highlightCodeLine(3);
          BSTModule.renderCanvas(node.val, path);
          playKeyClick(500 + sorted.length * 30, 0.03);
          logMsg(`In-order traversal visited: [${sorted.join(', ')}]...`);
          await waitStep();
          highlightCodeLine(4);
          await traverse(node.right);
        }

        await traverse(bstRoot);
        setLock(false);
        logMsg(`In-order Traversal Complete: [${sorted.join(', ')}] — Output is verified sorted.`);
      },

      reset() {
        playKeyClick(700, 0.04);
        bstRoot = buildBST([50, 25, 75, 12, 38, 60, 92]);
        this.renderCanvas();
        logMsg("Tree graph reset.");
      }
    };

    /* ══════════════════════════════════════════════════════════
       6. HASH TABLE MODULE (Segmented Bucket Rack)
    ══════════════════════════════════════════════════════════ */
    const HashTableModule = {
      renderControls() {
        const presets = DS_CONFIG.hashtable.presets;
        document.getElementById('ds-command-bar').innerHTML = `
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex flex-wrap items-center gap-2.5">
              <input id="ht-key-in" type="text" placeholder="Key" class="swiss-input w-24" onkeydown="if(event.key==='Enter') HashTableModule.insert()" />
              <input id="ht-val-in" type="text" placeholder="Value" class="swiss-input w-24" onkeydown="if(event.key==='Enter') HashTableModule.insert()" />
              <button class="btn-swiss-dark" onclick="HashTableModule.insert()">
                <span>+ Set Key</span>
              </button>
              <button class="btn-swiss-outline" onclick="HashTableModule.lookup()">
                <span>Lookup</span>
              </button>
              <button class="btn-swiss-danger" onclick="HashTableModule.deleteKey()">
                <span>Delete</span>
              </button>
              <button class="btn-swiss-outline" onclick="HashTableModule.reset()">
                <span>Reset</span>
              </button>
            </div>

            <div class="flex items-center gap-2 flex-shrink-0">
              <span class="text-xs font-mono text-slate-400">VECTORS:</span>
              ${presets.map((p, i) => `
                <button onclick="loadPreset(${i})" class="px-2.5 py-1 text-xs font-mono border border-slate-200 hover:bg-slate-50 text-slate-700 transition-all rounded-sm">
                  ${p.name}
                </button>
              `).join('')}
            </div>
          </div>
        `;
      },

      renderCanvas(activeBucket = -1, targetKey = null) {
        const stage = document.getElementById('ds-stage-container');
        if (!stage) return;
        stage.innerHTML = `
          <div class="w-full flex flex-col gap-2 max-w-md py-1">
            <div class="flex items-center justify-between text-[0.7rem] font-mono text-slate-500 mb-1">
              <span>BUCKET_ARRAY: ${HT_SIZE} SLOTS</span>
              <span class="text-cyan-400 font-mono">hash(k) = ∑(ASCII) mod ${HT_SIZE}</span>
            </div>

            ${htBuckets.map((bucket, i) => `
              <div class="flex items-center gap-2 p-2 border ${i === activeBucket ? 'border-emerald-500 bg-emerald-950/20' : 'border-slate-800 bg-[#0f1118]'} transition-all">
                <span class="font-mono text-xs text-slate-400 font-semibold px-2 py-0.5 bg-slate-900 border border-slate-800">
                  [0x0${i}]
                </span>
                
                <div class="flex items-center gap-1.5 flex-wrap flex-1">
                  ${bucket.length === 0 ? `
                    <span class="text-[0.7rem] font-mono text-slate-600">NULL_PTR</span>
                  ` : bucket.map((item, j) => `
                    <div class="px-2 py-0.5 border text-xs font-mono flex items-center gap-1 ${item.k === targetKey ? 'border-cyan-400 bg-cyan-950/60 text-cyan-200' : 'border-slate-700 bg-slate-800 text-slate-200'}">
                      <span class="font-bold text-slate-400">${item.k}:</span>
                      <span>${item.v}</span>
                    </div>
                    ${j < bucket.length - 1 ? '<span class="text-slate-600 text-xs font-mono">-></span>' : ''}
                  `).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        `;
      },

      insert() {
        playKeyClick(550, 0.04);
        const kInp = document.getElementById('ht-key-in');
        const vInp = document.getElementById('ht-val-in');
        const k = kInp.value.trim();
        const v = vInp.value.trim();
        if (!k || !v) { logMsg("Command rejected: Both Key and Value required."); return; }

        const idx = getHash(k);
        const bucket = htBuckets[idx];
        const existing = bucket.find(e => e.k === k);

        if (existing) {
          existing.v = v;
          logMsg(`Key updated: "${k}" := "${v}" at bucket offset [${idx}].`);
        } else {
          bucket.push({ k, v });
          logMsg(`Key inserted: "${k}" mapped to bucket offset [${idx}] via hash function.`);
        }

        kInp.value = '';
        vInp.value = '';
        this.renderCanvas(idx, k);
      },

      async lookup() {
        const kInp = document.getElementById('ht-key-in');
        const k = kInp.value.trim();
        if (!k) { logMsg("Command rejected: Key required."); return; }

        setCodeLines(DS_CONFIG.hashtable.codeLines.lookup);
        highlightCodeLine(0);
        const idx = getHash(k);
        const bucket = htBuckets[idx];
        const found = bucket.find(e => e.k === k);

        this.renderCanvas(idx, found ? k : null);
        highlightCodeLine(2);
        playKeyClick(found ? 850 : 400, 0.05);

        if (found) {
          highlightCodeLine(3);
          logMsg(`Key resolved: "${k}" -> "${found.v}" located at bucket segment [${idx}].`);
        } else {
          highlightCodeLine(4);
          logMsg(`Key missing: "${k}" not found in bucket index [${idx}].`);
        }
      },

      deleteKey() {
        playKeyClick(420, 0.04);
        const kInp = document.getElementById('ht-key-in');
        const k = kInp.value.trim();
        if (!k) { logMsg("Command rejected: Key required."); return; }

        const idx = getHash(k);
        const before = htBuckets[idx].length;
        htBuckets[idx] = htBuckets[idx].filter(e => e.k !== k);

        this.renderCanvas(idx);
        if (htBuckets[idx].length < before) logMsg(`Key "${k}" purged from bucket [${idx}].`);
        else logMsg(`Key "${k}" not found.`);
      },

      reset() {
        playKeyClick(700, 0.04);
        initHT();
        this.renderCanvas();
        logMsg("Bucket array reset.");
      }
    };

    /* ══════════════════════════════════════════════════════════
       MODULE REGISTRY & NAVIGATION
    ══════════════════════════════════════════════════════════ */
    const MODULES = {
      array: ArrayModule,
      linkedlist: LinkedListModule,
      stack: StackModule,
      queue: QueueModule,
      bst: BSTModule,
      hashtable: HashTableModule
    };

    function switchDS(ds) {
      if (isLocked) return;
      playKeyClick(700, 0.03);
      currentDS = ds;

      document.querySelectorAll('.nav-tab').forEach(btn => {
        btn.classList.remove('text-black', 'font-semibold', 'bg-slate-100');
        btn.classList.add('text-slate-600');
        if (btn.getAttribute('onclick').includes(ds)) {
          btn.classList.add('text-black', 'font-semibold', 'bg-slate-100');
          btn.classList.remove('text-slate-600');
        }
      });

      renderApp();
      logMsg(`Architecture loaded: <b>${DS_CONFIG[ds].title}</b>. Ready for execution.`);
    }

    // Initialize first render
    renderApp();
  </script>
</body>
